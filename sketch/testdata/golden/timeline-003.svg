<svg xmlns="http://www.w3.org/2000/svg" class="pele pele-timeline" viewBox="0 0 800 404" width="800" height="404" style="max-width:100%;height:auto;--_bg:var(--pele-bg,#fff);--_fg:var(--pele-fg,#1f1f1f);--_m:var(--pele-muted,#6e6e6e);--_l:var(--pele-line,#1f1f1f);--_s:var(--pele-surface,#f3f3f3);--_a:var(--pele-surface-alt,#e6e6e6);--_b:var(--pele-border,#8a8a8a);--_c:var(--pele-accent,#5b7bd5);color:var(--_fg);--_r:var(--pele-radius,4px);--_tw:var(--pele-title-weight,bold);--_hw:var(--pele-heading-weight,bold);--_fm:var(--pele-font-mono,monospace);font:16px sans-serif;letter-spacing:normal;word-spacing:normal;text-transform:none;direction:ltr;font-family:var(--pele-font,sans-serif)" fill="var(--_fg)" role="graphics-document document" aria-roledescription="timeline"><text class="pele-title" font-weight="var(--_tw)" text-anchor="middle" xml:space="preserve"><tspan x="400" y="25.6">England's History Timeline</tspan></text><path class="pele-axis" d="M8,156H785" fill="none" stroke="var(--_l)"/><path class="pele-marker" d="M792,156L784,159.36L784,152.64Z" fill="var(--_l)" stroke="none"/><g class="pele-cluster pele-section" data-id="Stone Age"><rect x="8" y="48" width="372" height="40" fill="var(--pele-series-1,#4c78a8)" style="rx:var(--_r)"/><text font-weight="var(--_hw)" fill="var(--_bg)" text-anchor="middle" xml:space="preserve"><tspan x="194" y="73.6">Stone Age</tspan></text><g class="pele-node pele-period" data-id="7600 BC"><rect x="8" y="96" width="176" height="40" fill="var(--pele-series-1,#4c78a8)" style="rx:var(--_r)"/><text fill="var(--_bg)" x="96" y="121.6" text-anchor="middle">7600 BC</text><path class="pele-edge" d="M96,136V176" fill="none" stroke="var(--_b)"/><circle class="pele-dot" cx="96" cy="156" r="4" fill="var(--pele-series-1,#4c78a8)" stroke="var(--_bg)" stroke-width="2"/><g class="pele-node pele-event"><rect x="8" y="176" width="176" height="70" fill="var(--pele-series-1,#4c78a8)" fill-opacity="0.16" style="rx:var(--_r)"/><text font-size="14" text-anchor="middle" xml:space="preserve"><tspan x="96" y="197.9">Britain's oldest known</tspan><tspan x="96" y="215.9">house was built in</tspan><tspan x="96" y="233.9">Orkney, Scotland</tspan></text></g></g><g class="pele-node pele-period" data-id="6000 BC"><rect x="204" y="96" width="176" height="40" fill="var(--pele-series-1,#4c78a8)" style="rx:var(--_r)"/><text fill="var(--_bg)" x="292" y="121.6" text-anchor="middle">6000 BC</text><path class="pele-edge" d="M292,136V176" fill="none" stroke="var(--_b)"/><circle class="pele-dot" cx="292" cy="156" r="4" fill="var(--pele-series-1,#4c78a8)" stroke="var(--_bg)" stroke-width="2"/><g class="pele-node pele-event"><rect x="204" y="176" width="176" height="124" fill="var(--pele-series-1,#4c78a8)" fill-opacity="0.16" style="rx:var(--_r)"/><text font-size="14" text-anchor="middle" xml:space="preserve"><tspan x="292" y="197.9">Sea levels rise and</tspan><tspan x="292" y="215.9">Britain becomes an</tspan><tspan x="292" y="233.9">island.</tspan><tspan x="292" y="251.9">The people who live</tspan><tspan x="292" y="269.9">here are</tspan><tspan x="292" y="287.9">hunter-gatherers.</tspan></text></g></g></g><g class="pele-cluster pele-section" data-id="Bronze Age"><rect x="400" y="48" width="372" height="40" fill="var(--pele-series-2,#f58518)" style="rx:var(--_r)"/><text font-weight="var(--_hw)" fill="var(--_bg)" text-anchor="middle" xml:space="preserve"><tspan x="586" y="73.6">Bronze Age</tspan></text><g class="pele-node pele-period" data-id="2300 BC"><rect x="400" y="96" width="176" height="40" fill="var(--pele-series-2,#f58518)" style="rx:var(--_r)"/><text fill="var(--_bg)" x="488" y="121.6" text-anchor="middle">2300 BC</text><path class="pele-edge" d="M488,136V176M488,282V290" fill="none" stroke="var(--_b)"/><circle class="pele-dot" cx="488" cy="156" r="4" fill="var(--pele-series-2,#f58518)" stroke="var(--_bg)" stroke-width="2"/><g class="pele-node pele-event"><rect x="400" y="176" width="176" height="106" fill="var(--pele-series-2,#f58518)" fill-opacity="0.16" style="rx:var(--_r)"/><text font-size="14" text-anchor="middle" xml:space="preserve"><tspan x="488" y="197.9">People arrive from</tspan><tspan x="488" y="215.9">Europe and settle in</tspan><tspan x="488" y="233.9">Britain.</tspan><tspan x="488" y="251.9">They bring farming and</tspan><tspan x="488" y="269.9">metalworking.</tspan></text></g><g class="pele-node pele-event"><rect x="400" y="290" width="176" height="70" fill="var(--pele-series-2,#f58518)" fill-opacity="0.16" style="rx:var(--_r)"/><text font-size="14" text-anchor="middle" xml:space="preserve"><tspan x="488" y="311.9">New styles of pottery</tspan><tspan x="488" y="329.9">and ways of burying the</tspan><tspan x="488" y="347.9">dead appear.</tspan></text></g></g><g class="pele-node pele-period" data-id="2200 BC"><rect x="596" y="96" width="176" height="40" fill="var(--pele-series-2,#f58518)" style="rx:var(--_r)"/><text fill="var(--_bg)" x="684" y="121.6" text-anchor="middle">2200 BC</text><path class="pele-edge" d="M684,136V176M684,282V290" fill="none" stroke="var(--_b)"/><circle class="pele-dot" cx="684" cy="156" r="4" fill="var(--pele-series-2,#f58518)" stroke="var(--_bg)" stroke-width="2"/><g class="pele-node pele-event"><rect x="596" y="176" width="176" height="106" fill="var(--pele-series-2,#f58518)" fill-opacity="0.16" style="rx:var(--_r)"/><text font-size="14" text-anchor="middle" xml:space="preserve"><tspan x="684" y="197.9">The last major building</tspan><tspan x="684" y="215.9">works are completed at</tspan><tspan x="684" y="233.9">Stonehenge.</tspan><tspan x="684" y="251.9">People now bury their</tspan><tspan x="684" y="269.9">dead in stone circles.</tspan></text></g><g class="pele-node pele-event"><rect x="596" y="290" width="176" height="106" fill="var(--pele-series-2,#f58518)" fill-opacity="0.16" style="rx:var(--_r)"/><text font-size="14" text-anchor="middle" xml:space="preserve"><tspan x="684" y="311.9">The first metal objects</tspan><tspan x="684" y="329.9">are made in</tspan><tspan x="684" y="347.9">Britain.Some other nice</tspan><tspan x="684" y="365.9">things happen. it is a</tspan><tspan x="684" y="383.9">good time to be alive.</tspan></text></g></g></g></svg>