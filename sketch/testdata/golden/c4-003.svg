)" x="0" y="15.55" text-anchor="middle">[MVC Rest Controller]</text><text class="pele-c4-descr" font-size="13" text-anchor="middle" xml:space="preserve"><tspan x="0" y="39.55">Provides customers with a</tspan><tspan x="0" y="59.55">summary of their bank accounts</tspan></text></g><g class="pele-node pele-shape-rect pele-c4-component" data-id="security" transform="translate(768,399)"><rect x="-108" y="-77" width="216" height="154" fill="var(--_s)" stroke="var(--_b)" style="rx:var(--_r)"/><text class="pele-c4-type" font-size="12" fill="var(--_m)" x="0" y="-49.8" text-anchor="middle">«component»</text><text class="pele-label" font-weight="var(--_hw)" text-anchor="middle" xml:space="preserve"><tspan x="0" y="-27.4">Security Component</tspan></text><text class="pele-c4-techn" font-size="13" fill="var(--_m)" x="0" y="-6.45" text-anchor="middle">[Spring Bean]</text><text class="pele-c4-descr" font-size="13" text-anchor="middle" xml:space="preserve"><tspan x="0" y="17.55">Provides functionality related to</tspan><tspan x="0" y="37.55">singing in, changing passwords,</tspan><tspan x="0" y="57.55">etc.</tspan></text></g><g class="pele-node pele-shape-rect pele-c4-component" data-id="mbsfacade" transform="translate(1084,399)"><rect x="-108" y="-77" width="216" height="154" fill="var(--_s)" stroke="var(--_b)" style="rx:var(--_r)"/><text class="pele-c4-type" font-size="12" fill="var(--_m)" x="0" y="-51.8" text-anchor="middle">«component»</text><text class="pele-label" font-weight="var(--_hw)" text-anchor="middle" xml:space="preserve"><tspan x="0" y="-29.4">Mainframe Banking</tspan><tspan x="0" y="-5.4">System Facade</tspan></text><text class="pele-c4-techn" font-size="13" fill="var(--_m)" x="0" y="15.55" text-anchor="middle">[Spring Bean]</text><text class="pele-c4-descr" font-size="13" text-anchor="middle" xml:space="preserve"><tspan x="0" y="39.55">A facade onto the mainframe</tspan><tspan x="0" y="59.55">banking system.</tspan></text></g></g><g class="pele-edge-labels" font-s