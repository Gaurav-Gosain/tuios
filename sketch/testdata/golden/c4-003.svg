"ma" transform="translate(424,97)"><rect x="-108" y="-97" width="216" height="194" fill="var(--_s)" stroke="var(--_b)" style="rx:var(--_r)"/><text class="pele-c4-type" font-size="12" fill="var(--_m)" x="0" y="-59.8" text-anchor="middle">«container»</text><text class="pele-label" font-weight="var(--_hw)" text-anchor="middle" xml:space="preserve"><tspan x="0" y="-37.4">Mobile App</tspan></text><text class="pele-c4-techn" font-size="13" fill="var(--_m)" x="0" y="-16.45" text-anchor="middle">[Xamarin]</text><text class="pele-c4-descr" font-size="13" text-anchor="middle" xml:space="preserve"><tspan x="0" y="7.55">Provides a limited subset to the</tspan><tspan x="0" y="27.55">internet banking functionality to</tspan><tspan x="0" y="47.55">customers via their mobile</tspan><tspan x="0" y="67.55">device.</tspan></text></g><g class="pele-node pele-shape-cyl pele-c4-container_db" data-id="db" transform="translate(740,97)"><path d="M-108,-85A108,12 0 0 1 108,-85V85A108,12 0 0 1 -108,85Z" fill="var(--_s)" stroke="var(--_b)"/><path d="M-108,-85A108,12 0 0 0 108,-85" fill="none" stroke="var(--_b)"/><text class="pele-c4-type" font-size="12" fill="var(--_m)" x="0" y="-53.8" text-anchor="middle">«container db»</text><text class="pele-label" font-weight="var(--_hw)" text-anchor="middle" xml:space="preserve"><tspan x="0" y="-31.4">Database</tspan></text><text class="pele-c4-techn" font-size="13" fill="var(--_m)" x="0" y="-10.45" text-anchor="middle">[Relational Database Schema]</text><text class="pele-c4-descr" font-size="13" text-anchor="middle" xml:space="preserve"><tspan x="0" y="13.55">Stores user registration</tspan><tspan x="0" y="33.55">information, hashed</tspan><tspan x="0" y="53.55">authentication credentials,</tspan><tspan x="0" y="73.55">access logs, etc.</tspan></text></g><g class="pele-node pele-shape-rect pele-c4-external_system pele-c4-external" data-id="mbs" transform="translate(1056,97)"><rect x="-108" y="-97" width="216" height="194" fill="var(--_bg)" stroke="var(--