="ma" transform="translate(444,91)"><rect x="-108" y="-91" width="216" height="182" fill="var(--_s)" stroke="var(--_b)" style="rx:var(--_r)"/><text class="pele-c4-type" font-size="12" fill="var(--_m)" x="0" y="-53.8" text-anchor="middle">«container»</text><text class="pele-label" font-weight="var(--_hw)" text-anchor="middle" xml:space="preserve"><tspan x="0" y="-31.4">Mobile App</tspan></text><text class="pele-c4-techn" font-size="13" fill="var(--_m)" x="0" y="-10.45" text-anchor="middle">[Xamarin]</text><text class="pele-c4-descr" font-size="13" text-anchor="middle" xml:space="preserve"><tspan x="0" y="12.05">Provides a limited subset to the</tspan><tspan x="0" y="29.05">internet banking functionality to</tspan><tspan x="0" y="46.05">customers via their mobile</tspan><tspan x="0" y="63.05">device.</tspan></text></g><g class="pele-node pele-shape-cyl pele-c4-container_db" data-id="db" transform="translate(780,91)"><path d="M-108,-79A108,12 0 0 1 108,-79V79A108,12 0 0 1 -108,79Z" fill="var(--_s)" stroke="var(--_b)"/><path d="M-108,-79A108,12 0 0 0 108,-79" fill="none" stroke="var(--_b)"/><text class="pele-c4-type" font-size="12" fill="var(--_m)" x="0" y="-47.8" text-anchor="middle">«container db»</text><text class="pele-label" font-weight="var(--_hw)" text-anchor="middle" xml:space="preserve"><tspan x="0" y="-25.4">Database</tspan></text><text class="pele-c4-techn" font-size="13" fill="var(--_m)" x="0" y="-4.45" text-anchor="middle">[Relational Database Schema]</text><text class="pele-c4-descr" font-size="13" text-anchor="middle" xml:space="preserve"><tspan x="0" y="18.05">Stores user registration</tspan><tspan x="0" y="35.05">information, hashed</tspan><tspan x="0" y="52.05">authentication credentials,</tspan><tspan x="0" y="69.05">access logs, etc.</tspan></text></g><g class="pele-node pele-shape-rect pele-c4-external_system pele-c4-external" data-id="mbs" transform="translate(1116,91)"><rect x="-108" y="-91" width="216" height="182" fill="var(--_bg)" stroke="var(-