nt" data-id="c3" transform="translate(136,397)"><rect x="-108" y="-75" width="216" height="150" fill="var(--_s)" stroke="var(--_b)" style="rx:var(--_r)"/><text class="pele-c4-type" font-size="12" fill="var(--_m)" x="0" y="-49.8" text-anchor="middle">«component»</text><text class="pele-label" font-weight="var(--_hw)" text-anchor="middle" xml:space="preserve"><tspan x="0" y="-27.4">Security Component</tspan></text><text class="pele-c4-techn" font-size="13" fill="var(--_m)" x="0" y="-6.45" text-anchor="middle">[Spring Bean]</text><text class="pele-c4-descr" font-size="13" text-anchor="middle" xml:space="preserve"><tspan x="0" y="17.55">Provides functionality Related to</tspan><tspan x="0" y="37.55">signing in, changing passwords,</tspan><tspan x="0" y="57.55">etc.</tspan></text></g><g class="pele-node pele-shape-rect pele-c4-component" data-id="c2" transform="translate(452,397)"><rect x="-108" y="-75" width="216" height="150" fill="var(--_s)" stroke="var(--_b)" style="rx:var(--_r)"/><text class="pele-c4-type" font-size="12" fill="var(--_m)" x="0" y="-39.8" text-anchor="middle">«component»</text><text class="pele-label" font-weight="var(--_hw)" text-anchor="middle" xml:space="preserve"><tspan x="0" y="-17.4">Sign In Controller</tspan></text><text class="pele-c4-techn" font-size="13" fill="var(--_m)" x="0" y="3.55" text-anchor="middle">[Spring MVC Rest Controller]</text><text class="pele-c4-descr" font-size="13" text-anchor="middle" xml:space="preserve"><tspan x="0" y="27.55">Allows users to sign in to the</tspan><tspan x="0" y="47.55">Internet Banking System.</tspan></text></g></g><g class="pele-edge-labels" font-size="13"><g class="pele-edge-label" data-id="c1-c2"><rect x="362.83" y="198" width="150.34" height="40" rx="3" fill="var(--_bg)"/><text style="fill:red;" x="438" y="212.55" text-anchor="middle">1: Submits credentials to</text><text class="pele-c4-techn" fill="var(--_m)" style="fill:red;" font-style="italic" text-anchor="middle" xml:space="preserve"><tspan x="438" y="232.55">[JSON/HTTPS]</tspan></text></g><g class="pele-edge-label" data-id="c2-c3"><rect x="241.23" y="367" width="105.54" height="60" rx="3" fill="var(--_bg)"/><text style="fill:red;" text-anchor="middle" xml:space="preserve"><tspan x="294" y="381.55">2: Calls</tspan><tspan x="294" y="401.55">isAuthenticated()</tspan><tspan x="294" y="421.55">on</tspan></text></g><g class="pele-edge-label" data-id="c3-c4"><rect x="66.95" y="213.57" width="130.1" height="60" rx="3" fill="var(--_bg)"/><text style="fill:red;" text-anchor="middle" xml:space="preserve"><tspan x="132" y="228.12">3: select * from users</tspan><tspan x="132" y="248.12">where username = ?</tspan></text><text class="pele-c4-techn" fill="var(--_m)" style="fill:red;" font-style="italic" text-anchor="middle" xml:space="preserve"><tspan x="132" y="268.12">[JDBC]</tspan></text></g></g></g></svg>