omponent" data-id="c3" transform="translate(136,380.5)"><rect x="-108" y="-70.5" width="216" height="141" fill="var(--_s)" stroke="var(--_b)" style="rx:var(--_r)"/><text class="pele-c4-type" font-size="12" fill="var(--_m)" x="0" y="-45.3" text-anchor="middle">«component»</text><text class="pele-label" font-weight="var(--_hw)" text-anchor="middle" xml:space="preserve"><tspan x="0" y="-22.9">Security Component</tspan></text><text class="pele-c4-techn" font-size="13" fill="var(--_m)" x="0" y="-1.95" text-anchor="middle">[Spring Bean]</text><text class="pele-c4-descr" font-size="13" text-anchor="middle" xml:space="preserve"><tspan x="0" y="20.55">Provides functionality Related to</tspan><tspan x="0" y="37.55">signing in, changing passwords,</tspan><tspan x="0" y="54.55">etc.</tspan></text></g><g class="pele-node pele-shape-rect pele-c4-component" data-id="c2" transform="translate(472,380.5)"><rect x="-108" y="-70.5" width="216" height="141" fill="var(--_s)" stroke="var(--_b)" style="rx:var(--_r)"/><text class="pele-c4-type" font-size="12" fill="var(--_m)" x="0" y="-36.8" text-anchor="middle">«component»</text><text class="pele-label" font-weight="var(--_hw)" text-anchor="middle" xml:space="preserve"><tspan x="0" y="-14.4">Sign In Controller</tspan></text><text class="pele-c4-techn" font-size="13" fill="var(--_m)" x="0" y="6.55" text-anchor="middle">[Spring MVC Rest Controller]</text><text class="pele-c4-descr" font-size="13" text-anchor="middle" xml:space="preserve"><tspan x="0" y="29.05">Allows users to sign in to the</tspan><tspan x="0" y="46.05">Internet Banking System.</tspan></text></g></g><g class="pele-edge-labels" font-size="13"><g class="pele-edge-label" data-id="c1-c2"><rect x="382.83" y="186" width="150.34" height="40" rx="3" fill="var(--_bg)"/><text style="fill:red;" x="458" y="200.55" text-anchor="middle">1: Submits credentials to</text><text class="pele-c4-techn" fill="var(--_m)" style="fill:red;" font-style="italic" text-anchor="middle" xml:space="preserve"><tspan x="458" y="220.55">[JSON/HTTPS]</tspan></text></g><g class="pele-edge-label" data-id="c2-c3"><rect x="247.23" y="415" width="105.54" height="51" rx="3" fill="var(--_bg)"/><text style="fill:red;" text-anchor="middle" xml:space="preserve"><tspan x="300" y="428.05">2: Calls</tspan><tspan x="300" y="445.05">isAuthenticated()</tspan><tspan x="300" y="462.05">on</tspan></text></g><g class="pele-edge-label" data-id="c3-c4"><rect x="66.95" y="191.76" width="130.1" height="54" rx="3" fill="var(--_bg)"/><text style="fill:red;" text-anchor="middle" xml:space="preserve"><tspan x="132" y="204.81">3: select * from users</tspan><tspan x="132" y="221.81">where username = ?</tspan></text><text class="pele-c4-techn" fill="var(--_m)" style="fill:red;" font-style="italic" text-anchor="middle" xml:space="preserve"><tspan x="132" y="240.31">[JDBC]</tspan></text></g></g></g></svg>