<svg xmlns="http://www.w3.org/2000/svg" class="pele pele-block" viewBox="0 0 535 352" width="535" height="352" style="max-width:100%;height:auto;--_bg:var(--pele-bg,#fff);--_fg:var(--pele-fg,#1f1f1f);--_m:var(--pele-muted,#6e6e6e);--_l:var(--pele-line,#1f1f1f);--_s:var(--pele-surface,#f3f3f3);--_a:var(--pele-surface-alt,#e6e6e6);--_b:var(--pele-border,#8a8a8a);--_c:var(--pele-accent,#5b7bd5);color:var(--_fg);--_r:var(--pele-radius,4px);--_fm:var(--pele-font-mono,monospace);font:16px sans-serif;letter-spacing:normal;word-spacing:normal;text-transform:none;direction:ltr;font-family:var(--pele-font,sans-serif)" fill="var(--_fg)" role="graphics-document document" aria-roledescription="block"><g class="pele-nodes"><g class="pele-node pele-shape-circle" data-id="Start" transform="translate(90.46,36.72)"><circle r="28.72" fill="var(--_s)" stroke="var(--_b)" style="fill:#969;"/><text class="pele-label" fill="var(--pele-fg-on-dark,#fff)" x="0" y="5.6" text-anchor="middle">Start</text></g><g class="pele-node pele-shape-block-arrow" data-id="down" transform="translate(90.46,106.17)"><polygon points="8,-15.5 8,0.5 15,0.5 0,15.5 -15,0.5 -8,0.5 -8,-15.5" stroke-linejoin="round" fill="var(--_s)" stroke="var(--_b)"/><text class="pele-label" x="0" y="-1.9" text-anchor="middle"></text></g><g class="pele-node pele-shape-hex" data-id="Decision" transform="translate(90.46,175.62)"><polygon points="-70.46,-24 70.46,-24 82.46,0 70.46,24 -70.46,24 -82.46,0" fill="var(--_s)" stroke="var(--_b)"/><text class="pele-label" x="0" y="5.6" text-anchor="middle">Make Decision</text></g><g class="pele-node pele-shape-block-arrow" data-id="right" transform="translate(267.37,175.62)"><polygon points="-29.78,-16 9.78,-16 9.78,-23 29.78,0 9.78,23 9.78,16 -29.78,16" stroke-linejoin="round" fill="var(--_s)" stroke="var(--_b)"/><text class="pele-label" x="-10" y="5.6" text-anchor="middle">Yes</text></g><g class="pele-node pele-shape-rect" data-id="Process1" transform="translate(444.28,175.62)"><rect x="-82.