<svg xmlns="http://www.w3.org/2000/svg" class="pele pele-quadrantChart" viewBox="0 0 500 500" width="500" height="500" style="max-width:100%;height:auto;--_bg:var(--pele-bg,#fff);--_fg:var(--pele-fg,#1f1f1f);--_m:var(--pele-muted,#6e6e6e);--_l:var(--pele-line,#1f1f1f);--_s:var(--pele-surface,#f3f3f3);--_a:var(--pele-surface-alt,#e6e6e6);--_b:var(--pele-border,#8a8a8a);--_c:var(--pele-accent,#5b7bd5);color:var(--_fg);--_r:var(--pele-radius,4px);--_tw:var(--pele-title-weight,bold);--_fm:var(--pele-font-mono,monospace);font:16px sans-serif;letter-spacing:normal;word-spacing:normal;text-transform:none;direction:ltr;font-family:var(--pele-font,sans-serif)" fill="var(--_fg)" role="graphics-document document" aria-roledescription="quadrantChart"><text class="pele-title" font-weight="var(--_tw)" text-anchor="middle" xml:space="preserve"><tspan x="250" y="22.6">Reach and engagement of campaigns</tspan></text><g class="pele-quadrants" fill="var(--_s)" stroke="var(--_b)"><g class="pele-quadrant" data-id="1"><rect x="265" y="42" width="227" height="210" style="rx:var(--_r)"/><text class="pele-label" fill="var(--_fg)" stroke="none" x="378.5" y="64.6" text-anchor="middle">We should expand</text></g><g class="pele-quadrant" data-id="2"><rect x="34" y="42" width="227" height="210" style="rx:var(--_r)"/><text class="pele-label" fill="var(--_fg)" stroke="none" x="147.5" y="64.6" text-anchor="middle">Need to promote</text></g><g class="pele-quadrant" data-id="3"><rect x="34" y="256" width="227" height="210" style="rx:var(--_r)"/><text class="pele-label" fill="var(--_fg)" stroke="none" x="147.5" y="278.6" text-anchor="middle">Re-evaluate</text></g><g class="pele-quadrant" data-id="4"><rect x="265" y="256" width="227" height="210" style="rx:var(--_r)"/><text class="pele-label" fill="var(--_fg)" stroke="none" x="378.5" y="278.6" text-anchor="middle">May be improved</text></g></g><g class="pele-axis-labels" font-size="14" fill="var(--_m)"><text x="148.5" y="486.4" text-anchor="middle">Low Reach</text><text x="377.5" y="486.4" text-anchor="middle">High Reach</text><g transform="translate(18.5,360) rotate(-90)"><text x="0" y="4.9" text-anchor="middle">Low Engagement</text></g><g transform="translate(18.5,148) rotate(-90)"><text x="0" y="4.9" text-anchor="middle">High Engagement</text></g></g><g class="pele-points" fill="var(--pele-series-1,#4c78a8)"><circle class="pele-point class3" data-id="Campaign F" cx="217.2" cy="254" r="10" style="fill:#0000ff;"/><circle class="pele-point class2" data-id="Campaign E" cx="263" cy="296.4" r="10" style="fill:#908342;stroke:#310085;stroke-width:10px;"/><circle class="pele-point" data-id="Campaign D" cx="308.8" cy="338.8" r="15" style="fill:#ff33f0;stroke:#00ff0f;stroke-width:5px;"/><circle class="pele-point" data-id="Campaign C" cx="354.6" cy="381.2" r="25" style="fill:#00ff33;"/><circle class="pele-point class1" data-id="Campaign B" cx="400.4" cy="423.6" r="10" style="fill:#ff3300;"/><circle class="pele-point" data-id="Campaign A" cx="446.2" cy="466" r="12"/></g><g class="pele-point-labels" font-size="12"><text class="pele-label" x="446.2" y="446" text-anchor="middle">Campaign A</text><text class="pele-label" x="448.41" y="427.8" text-anchor="middle">Campaign B</text><text class="pele-label" x="354.6" y="422.6" text-anchor="middle">Campaign C</text><text class="pele-label" x="364.64" y="343" text-anchor="middle">Campaign D</text><text class="pele-label" x="316.01" y="300.6" text-anchor="middle">Campaign E</text><text class="pele-label" x="217.2" y="236" text-anchor="middle">Campaign F</text></g></svg>