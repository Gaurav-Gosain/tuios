<svg xmlns="http://www.w3.org/2000/svg" class="pele pele-quadrantChart" viewBox="0 0 500 500" width="500" height="500" style="max-width:100%;height:auto;--_bg:var(--pele-bg,#fff);--_fg:var(--pele-fg,#1f1f1f);--_m:var(--pele-muted,#6e6e6e);--_l:var(--pele-line,#1f1f1f);--_s:var(--pele-surface,#f3f3f3);--_a:var(--pele-surface-alt,#e6e6e6);--_b:var(--pele-border,#8a8a8a);--_c:var(--pele-accent,#5b7bd5);color:var(--_fg);--_r:var(--pele-radius,4px);--_tw:var(--pele-title-weight,bold);--_fm:var(--pele-font-mono,monospace);font:16px sans-serif;letter-spacing:normal;word-spacing:normal;text-transform:none;direction:ltr;font-family:var(--pele-font,sans-serif)" fill="var(--_fg)" role="graphics-document document" aria-roledescription="quadrantChart"><text class="pele-title" font-weight="var(--_tw)" text-anchor="middle" xml:space="preserve"><tspan x="250" y="22.6">Reach and engagement of campaigns</tspan></text><g class="pele-quadrants" fill="var(--_s)" stroke="var(--_b)"><g class="pele-quadrant" data-id="1"><rect x="265" y="42" width="227" height="210" style="rx:var(--_r)"/><text class="pele-label" fill="var(--_fg)" stroke="none" x="378.5" y="64.6" text-anchor="middle">We should expand</text></g><g class="pele-quadrant" data-id="2"><rect x="34" y="42" width="227" height="210" style="rx:var(--_r)"/><text class="pele-label" fill="var(--_fg)" stroke="none" x="147.5" y="64.6" text-anchor="middle">Need to promote</text></g><g class="pele-quadrant" data-id="3"><rect x="34" y="256" width="227" height="210" style="rx:var(--_r)"/><text class="pele-label" fill="var(--_fg)" stroke="none" x="147.5" y="278.6" text-anchor="middle">Re-evaluate</text></g><g class="pele-quadrant" data-id="4"><rect x="265" y="256" width="227" height="210" style="rx:var(--_r)"/><text class="pele-label" fill="var(--_fg)" stroke="none" x="378.5" y="278.6" text-anchor="middle">May be improved</text></g></g><g class="pele-axis-labels" font-size="14" fill="var(--_m)"><text x="148.5" y="486.4" text-anchor="middle">Low Reach</text><text x="377.5" y="486.4" text-anchor="middle">High Reach</text><g transform="translate(18.5,360) rotate(-90)"><text x="0" y="4.9" text-anchor="middle">Low Engagement</text></g><g transform="translate(18.5,148) rotate(-90)"><text x="0" y="4.9" text-anchor="middle">High Engagement</text></g></g><g class="pele-points" fill="var(--pele-series-1,#4c78a8)"><circle class="pele-point" data-id="Campaign F" cx="194.3" cy="135.28" r="5"/><circle class="pele-point" data-id="Campaign E" cx="217.2" cy="321.84" r="5"/><circle class="pele-point" data-id="Campaign D" cx="391.24" cy="321.84" r="5"/><circle class="pele-point" data-id="Campaign C" cx="295.06" cy="173.44" r="5"/><circle class="pele-point" data-id="Campaign B" cx="240.1" cy="368.48" r="5"/><circle class="pele-point" data-id="Campaign A" cx="171.4" cy="211.6" r="5"/></g><g class="pele-point-labels" font-size="12"><text class="pele-label" x="171.4" y="233" text-anchor="middle">Campaign A</text><text class="pele-label" x="197.09" y="372.68" text-anchor="middle">Campaign B</text><text class="pele-label" x="338.4" y="177.64" text-anchor="middle">Campaign C</text><text class="pele-label" x="391.24" y="343.24" text-anchor="middle">Campaign D</text><text class="pele-label" x="217.2" y="343.24" text-anchor="middle">Campaign E</text><text class="pele-label" x="194.3" y="156.68" text-anchor="middle">Campaign F</text></g></svg>