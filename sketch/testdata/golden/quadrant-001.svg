<svg xmlns="http://www.w3.org/2000/svg" class="pele pele-quadrantChart" viewBox="0 0 400 400" width="400" height="400" style="max-width:100%;height:auto;--_bg:var(--pele-bg,#fff);--_fg:var(--pele-fg,#1f1f1f);--_m:var(--pele-muted,#6e6e6e);--_l:var(--pele-line,#1f1f1f);--_s:var(--pele-surface,#f3f3f3);--_a:var(--pele-surface-alt,#e6e6e6);--_b:var(--pele-border,#8a8a8a);--_c:var(--pele-accent,#5b7bd5);color:var(--_fg);--_r:var(--pele-radius,4px);--_fm:var(--pele-font-mono,monospace);font:16px sans-serif;letter-spacing:normal;word-spacing:normal;text-transform:none;direction:ltr;font-family:var(--pele-font,sans-serif)" fill="var(--_fg)" role="graphics-document document" aria-roledescription="quadrantChart"><g class="pele-quadrants" fill="var(--_s)" stroke="var(--_b)"><g class="pele-quadrant" data-id="1"><rect x="215" y="34" width="177" height="177" style="rx:var(--_r)"/><text class="pele-label" fill="var(--_fg)" stroke="none" x="303.5" y="128.1" text-anchor="middle">Plan</text></g><g class="pele-quadrant" data-id="2"><rect x="34" y="34" width="177" height="177" style="rx:var(--_r)"/><text class="pele-label" fill="var(--_fg)" stroke="none" x="122.5" y="128.1" text-anchor="middle">Do</text></g><g class="pele-quadrant" data-id="3"><rect x="34" y="215" width="177" height="177" style="rx:var(--_r)"/><text class="pele-label" fill="var(--_fg)" stroke="none" x="122.5" y="309.1" text-anchor="middle">Delegate</text></g><g class="pele-quadrant" data-id="4"><rect x="215" y="215" width="177" height="177" style="rx:var(--_r)"/><text class="pele-label" fill="var(--_fg)" stroke="none" x="303.5" y="309.1" text-anchor="middle">Delete</text></g></g><g class="pele-axis-labels" font-size="14" fill="var(--_m)"><text x="123.5" y="23.4" text-anchor="middle">Urgent</text><text x="302.5" y="23.4" text-anchor="middle">Not Urgent</text><g transform="translate(18.5,302.5) rotate(-90)"><text x="0" y="4.9" text-anchor="middle">Not Important</text></g><g transform="translate(18.5,123.5) rotate(-90)">