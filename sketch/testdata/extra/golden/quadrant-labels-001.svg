<svg xmlns="http://www.w3.org/2000/svg" class="pele pele-quadrantChart" viewBox="0 0 320 320" width="320" height="320" style="max-width:100%;height:auto;--_bg:var(--pele-bg,#fff);--_fg:var(--pele-fg,#1f1f1f);--_m:var(--pele-muted,#6e6e6e);--_l:var(--pele-line,#1f1f1f);--_s:var(--pele-surface,#f3f3f3);--_a:var(--pele-surface-alt,#e6e6e6);--_b:var(--pele-border,#8a8a8a);--_c:var(--pele-accent,#5b7bd5);color:var(--_fg);--_r:var(--pele-radius,4px);--_tw:var(--pele-title-weight,bold);--_fm:var(--pele-font-mono,monospace);font:16px sans-serif;letter-spacing:normal;word-spacing:normal;text-transform:none;direction:ltr;font-family:var(--pele-font,sans-serif)" fill="var(--_fg)" role="graphics-document document" aria-roledescription="quadrantChart"><text class="pele-title" font-weight="var(--_tw)" text-anchor="middle" xml:space="preserve"><tspan x="160" y="22.6">Q4 candidates by effort and impact</tspan></text><g class="pele-quadrants" fill="var(--_s)" stroke="var(--_b)"><g class="pele-quadrant" data-id="1"><rect x="175" y="42" width="137" height="120" style="rx:var(--_r)"/><text class="pele-label" fill="var(--_fg)" stroke="none" x="243.5" y="64.6" text-anchor="middle">Plan carefully</text></g><g class="pele-quadrant" data-id="2"><rect x="34" y="42" width="137" height="120" style="rx:var(--_r)"/><text class="pele-label" fill="var(--_fg)" stroke="none" x="102.5" y="64.6" text-anchor="middle">Do first</text></g><g class="pele-quadrant" data-id="3"><rect x="34" y="166" width="137" height="120" style="rx:var(--_r)"/><text class="pele-label" fill="var(--_fg)" stroke="none" x="102.5" y="188.6" text-anchor="middle">Reconsider</text></g><g class="pele-quadrant" data-id="4"><rect x="175" y="166" width="137" height="120" style="rx:var(--_r)"/><text class="pele-label" fill="var(--_fg)" stroke="none" x="243.5" y="188.6" text-anchor="middle">Quick wins</text></g></g><g class="pele-axis-labels" font-size="14" fill="var(--_m)"><text x="103.5" y="306.4" text-anchor="middle">Low effort</text>