<svg xmlns="http://www.w3.org/2000/svg" class="pele pele-block" viewBox="0 0 172 88" width="172" height="88" style="max-width:100%;height:auto;--_bg:var(--pele-bg,#fff);--_fg:var(--pele-fg,#1f1f1f);--_m:var(--pele-muted,#6e6e6e);--_l:var(--pele-line,#1f1f1f);--_s:var(--pele-surface,#f3f3f3);--_a:var(--pele-surface-alt,#e6e6e6);--_b:var(--pele-border,#8a8a8a);--_c:var(--pele-accent,#5b7bd5);color:var(--_fg);--_r:var(--pele-radius,4px);--_fm:var(--pele-font-mono,monospace);font:16px sans-serif;letter-spacing:normal;word-spacing:normal;text-transform:none;direction:ltr;font-family:var(--pele-font,sans-serif)" fill="var(--_fg)" role="graphics-document document" aria-roledescription="block"><g class="pele-clusters"><g class="pele-cluster" data-id="g"><rect x="8" y="8" width="72" height="72" fill="var(--_a)" stroke="var(--_b)" style="rx:var(--_r);fill:#fee;"/></g><g class="pele-cluster" data-id="h"><rect x="92" y="8" width="72" height="72" fill="var(--_a)" fill-opacity="0.5" stroke="var(--_b)" style="rx:var(--_r)"/></g></g><g class="pele-nodes"><g class="pele-node pele-shape-rect" data-id="a" transform="translate(44,44)"><rect x="-24" y="-24" width="48" height="48" fill="var(--_s)" stroke="var(--_b)" style="rx:var(--_r)"/><text class="pele-label" x="0" y="5.6" text-anchor="middle">a</text></g><g class="pele-node pele-shape-rect" data-id="b" transform="translate(128,44)"><rect x="-24" y="-24" width="48" height="48" fill="var(--_s)" stroke="var(--_b)" style="rx:var(--_r)"/><text class="pele-label" x="0" y="5.6" text-anchor="middle">b</text></g></g></svg>