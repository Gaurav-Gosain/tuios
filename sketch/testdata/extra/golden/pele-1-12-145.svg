<svg xmlns="http://www.w3.org/2000/svg" class="pele pele-treemap" viewBox="0 0 656 56" width="656" height="56" style="max-width:100%;height:auto;--_bg:var(--pele-bg,#fff);--_fg:var(--pele-fg,#1f1f1f);--_m:var(--pele-muted,#6e6e6e);--_l:var(--pele-line,#1f1f1f);--_s:var(--pele-surface,#f3f3f3);--_a:var(--pele-surface-alt,#e6e6e6);--_b:var(--pele-border,#8a8a8a);--_c:var(--pele-accent,#5b7bd5);color:var(--_fg);--_r:var(--pele-radius,4px);--_hw:var(--pele-heading-weight,bold);--_fm:var(--pele-font-mono,monospace);font:16px sans-serif;letter-spacing:normal;word-spacing:normal;text-transform:none;direction:ltr;font-family:var(--pele-font,sans-serif)" fill="var(--_fg)" role="graphics-document document" aria-roledescription="treemap"><g class="pele-sections" font-size="14"><g class="pele-node pele-section" data-id="Section"><rect x="8" y="8" width="640" height="40" fill="var(--pele-series-1,#4c78a8)" fill-opacity="0.12" stroke="var(--pele-series-1,#4c78a8)" style="rx:var(--_r)"/><text x="16" y="22.2" font-weight="var(--_hw)" font-size="12">Section</text></g></g><g class="pele-leaves" text-anchor="middle" fill="var(--_bg)"><g class="pele-node pele-leaf" data-id="Leaf"><rect x="14" y="26" width="628" height="16" fill="var(--pele-series-1,#4c78a8)" style="rx:var(--_r)"/><text x="328" y="37.15" font-size="9">Leaf</text></g></g></svg>