<svg xmlns="http://www.w3.org/2000/svg" class="pele pele-state" viewBox="0 0 616 303" width="616" height="303" style="max-width:100%;height:auto;--_bg:var(--pele-bg,#fff);--_fg:var(--pele-fg,#1f1f1f);--_m:var(--pele-muted,#6e6e6e);--_l:var(--pele-line,#1f1f1f);--_s:var(--pele-surface,#f3f3f3);--_a:var(--pele-surface-alt,#e6e6e6);--_b:var(--pele-border,#8a8a8a);--_c:var(--pele-accent,#5b7bd5);color:var(--_fg);--_fm:var(--pele-font-mono,monospace);font:16px sans-serif;letter-spacing:normal;word-spacing:normal;text-transform:none;direction:ltr;font-family:var(--pele-font,sans-serif)" fill="var(--_fg)" role="graphics-document document" aria-roledescription="state"><g class="pele-edges" fill="none" stroke="var(--_l)" stroke-linecap="round"><g class="pele-edge pele-transition" data-id="edge0"><path d="M120,22L120,59"/><path class="pele-marker" d="M120,66L116.64,58L123.36,58Z" fill="var(--_l)" stroke="none"/></g><g class="pele-edge pele-transition" data-id="edge1"><path d="M120,149L120,244"/><path class="pele-marker" d="M120,251L116.64,243L123.36,243Z" fill="var(--_l)" stroke="none"/></g><g class="pele-edge pele-note-edge" stroke="var(--_b)" stroke-dasharray="3 4" data-id="S1-S1----note-2"><path d="M232,107.5L276,107.5"/></g></g><g class="pele-edge-labels" font-size="14"><g class="pele-edge-label" data-id="edge1"><rect x="18" y="169.5" width="204" height="54" rx="3" fill="var(--_bg)"/><text text-anchor="middle" xml:space="preserve"><tspan x="120" y="183.4">用户提交订单后，系统检查库存</tspan><tspan x="120" y="201.4">并生成发货单，然后通知仓库进</tspan><tspan x="120" y="219.4">行拣货和包装。</tspan></text></g></g><g class="pele-nodes"><g class="pele-node pele-state-start" data-id="root_start" transform="translate(120,15)"><circle r="7" fill="var(--_l)"/></g><g class="pele-node pele-state" data-id="S2" transform="translate(120,273)"><rect x="-28" y="-22" width="56" height="44" rx="10" fill="var(--_s)" stroke="var(--_b)"/><text class="pele-label" x="0" y="5.6" text-anchor="middle">S2</text></g><g class="pele-node pele-state" data-id="S1" transform="translate(120,107.5)"><rect x="-112" y="-41.5" width="224" height="83" rx="10" fill="var(--_s)" stroke="var(--_b)"/><text class="pele-label" text-anchor="middle" xml:space="preserve"><tspan x="0" y="-15.4">在庫引当の結果を基幹シス</tspan><tspan x="0" y="5.6">テムへ連携し出荷指示を倉</tspan><tspan x="0" y="26.6">庫管理システムに送信する</tspan></text></g><g class="pele-note" data-id="S1----note-2" transform="translate(442,107.5)"><path d="M-166,-26H158L166,-18V26H-166Z" fill="var(--_bg)" stroke="var(--_b)"/><path d="M158,-26V-18H166" fill="none" stroke="var(--_b)"/><text class="pele-label" font-size="14" fill="var(--_m)" text-anchor="middle" xml:space="preserve"><tspan x="0" y="-4.1">在庫引当の結果を基幹システムへ連携し、出荷指</tspan><tspan x="0" y="13.9">示を倉庫管理システムに送信して完了を確認する</tspan></text></g></g></svg>