<svg xmlns="http://www.w3.org/2000/svg" class="pele pele-treemap" viewBox="0 0 656 416" width="656" height="416" style="max-width:100%;height:auto;--_bg:var(--pele-bg,#fff);--_fg:var(--pele-fg,#1f1f1f);--_m:var(--pele-muted,#6e6e6e);--_l:var(--pele-line,#1f1f1f);--_s:var(--pele-surface,#f3f3f3);--_a:var(--pele-surface-alt,#e6e6e6);--_b:var(--pele-border,#8a8a8a);--_c:var(--pele-accent,#5b7bd5);color:var(--_fg);--_r:var(--pele-radius,4px);--_fm:var(--pele-font-mono,monospace);font:16px sans-serif;letter-spacing:normal;word-spacing:normal;text-transform:none;direction:ltr;font-family:var(--pele-font,sans-serif)" fill="var(--_fg)" role="graphics-document document" aria-roledescription="treemap"><g class="pele-leaves" text-anchor="middle" fill="var(--_bg)"><g class="pele-node pele-leaf" data-id="big"><rect x="8" y="8" width="637" height="400" fill="var(--pele-series-1,#4c78a8)" style="rx:var(--_r)"/><text x="326.5" y="205.48" font-size="16">big</text><text class="pele-value" x="326.5" y="222.55" font-size="13">1,000</text></g><g class="pele-node pele-leaf" data-id="small"><title>small</title><rect x="647" y="8" width="1" height="400" fill="var(--pele-series-2,#f58518)" style="rx:min(var(--_r),0.25px)"/></g></g></svg>