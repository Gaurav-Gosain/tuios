#!/usr/sbin/nft -f
# Firewall for a learn.tuios.dev host. Port 22 is the tour. The admin sshd
# moves to 2222 and takes connections only from the tailnet (100.64.0.0/10).
# Change ADMIN_NET to your own address if you do not use Tailscale.
# The cloud firewall (security list, VPC rules) must open 22/tcp as well.

define ADMIN_NET = 100.64.0.0/10

table inet filter {
  set tour_flood {
    type ipv4_addr; flags dynamic, timeout; timeout 1m;
  }
  chain input {
    type filter hook input priority 0; policy drop;
    iif lo accept
    ct state established,related accept
    ct state invalid drop
    ip protocol icmp accept
    ip6 nexthdr icmpv6 accept
    # The tour. The server has its own per-address limits; this stops a
    # flood before it reaches the process.
    tcp dport 22 ct state new add @tour_flood { ip saddr limit rate over 30/minute } drop
    tcp dport 22 accept
    # The admin sshd, from the admin network only.
    tcp dport 2222 ip saddr $ADMIN_NET accept
    udp dport 41641 accept comment "tailscale"
  }
  chain forward {
    type filter hook forward priority 0; policy drop;
  }
}
