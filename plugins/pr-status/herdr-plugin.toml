# The hooks are here because run = "event" is not in tuios-plugin.toml yet.
id = "tuios.pr-status"
name = "PR status"
version = "0.1.0"
min_herdr_version = "0.9.3"
platforms = ["linux", "macos"]

[[events]]
on = "pane.focused"
command = ["sh", "pr-status.sh"]

[[events]]
on = "tab.focused"
command = ["sh", "pr-status.sh"]

[[events]]
on = "workspace.focused"
command = ["sh", "pr-status.sh"]

[[actions]]
id = "refresh"
title = "Refresh"
command = ["sh", "pr-status.sh", "refresh"]

[[actions]]
id = "open"
title = "Open in the browser"
command = ["sh", "pr-status.sh", "open"]
