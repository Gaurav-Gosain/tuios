api = 1
id = "tuios.pr-status"
name = "PR status"
version = "0.2.0"
description = "Shows the pull request and CI state of the focused pane's folder in the dock"
min_tuios = "0.13.0"
platforms = ["linux", "macos"]

[permissions]
grants = ["ui"]

[[cell]]
id = "status"

# Runs on each focus and exits. Nothing stays in memory.
[[process]]
id = "focus"
run = "event"
on = ["pane.focused", "tab.focused", "workspace.focused"]
command = ["sh", "pr-status.sh"]

[[process]]
id = "refresh"
run = "action"
title = "Refresh"
command = ["sh", "pr-status.sh", "refresh"]

[[process]]
id = "open"
run = "action"
title = "Open in the browser"
command = ["sh", "pr-status.sh", "open"]
