name: plugin

on:
  push:
  pull_request:

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: stable
      # The newest release, or the main branch while no release has
      # tuios plugins check yet.
      - name: Install tuios
        run: |
          curl -fsSL https://raw.githubusercontent.com/Gaurav-Gosain/tuios/main/install.sh | bash
          # An older tuios answers check --help with its own help, so look
          # for check in the list of commands.
          if ! tuios plugins --help 2>&1 | grep -qE '^\s+check\b'; then
            go install github.com/Gaurav-Gosain/tuios/cmd/tuios@main
            echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
          fi
      - name: Check the manifest
        run: tuios plugins check .
      - name: Attach the plugin to the release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          name="${GITHUB_REPOSITORY#*/}-${GITHUB_REF_NAME}.tar.gz"
          git archive --format=tar.gz --prefix="${GITHUB_REPOSITORY#*/}/" -o "$name" HEAD
          sha256sum "$name" > checksums.txt
          gh release create "$GITHUB_REF_NAME" "$name" checksums.txt --verify-tag --notes "Install with: tuios plugins install $GITHUB_REPOSITORY@$GITHUB_REF_NAME"
