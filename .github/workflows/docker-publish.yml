name: Create and publish a Docker image

# Builds the image from a version tag, pushes it to the GitHub Container
# Registry, and attests where it was built. The docker/* actions are third
# party, so each is pinned to a commit with its release in a comment; Dependabot
# moves both together.

on:
  push:
    tags: ["v*.*.*"]

# The job asks for what it needs; nothing else in the workflow gets a token.
permissions: {}

# One publish per tag, and never cancelled halfway: a cancelled push can leave
# a tag in the registry with no attestation.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push-image:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      # Pushing to ghcr.io.
      packages: write
      # Signing and storing the attestation.
      id-token: write
      attestations: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Log in to the Container registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}

      - name: Build and push Docker image
        id: push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      # attest-build-provenance became a thin wrapper over actions/attest in
      # v4, and its notes point new use at actions/attest. With no predicate
      # given, actions/attest writes the same SLSA build provenance.
      #
      # Storage records exist only for repositories an organization owns, and
      # this one is a user's, so the action is told not to try.
      - name: Generate artifact attestation
        uses: actions/attest@v4
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
          create-storage-record: false
