name: End-to-end TUI regressions

# Drives a real tuios binary in a real PTY and asserts on the rendered screen.
# No terminal is needed: the harness allocates the pty itself, so this runs on a
# stock runner with no xvfb or tmux.

# A draft pull request skips the shards. Marking it ready for review starts a
# run, and every push after that runs them. The other workflows still run on a
# draft. A skipped shard shows as "skipping", never as "pass".
on:
  push:
    branches: [main]
  pull_request:
    # labeled: the full-suite label starts a run of the whole suite on the
    # head (see "Choose the frame paths"). Any other label starts a run whose
    # jobs all skip.
    types: [opened, synchronize, reopened, ready_for_review, labeled]
    # No path filter: the shard plan job runs on every pull request, so a
    # pull request always shows that this workflow started. A change that
    # reaches no test, such as one to the docs, starts no shard.
  # The merge queue runs the whole suite on the commit it is about to land,
  # on every frame path and backend (see "Choose the frame paths").
  merge_group:
    types: [checks_requested]
  workflow_dispatch:
    inputs:
      skip_if_tested:
        description: Skip the real cells shards when this commit already passed them in a pull request or merge queue run
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  # A pull request's group is its ref, so a newer push cancels the run in
  # progress. Every other run (main, the nightly, a manual run) gets a group of
  # its own and is never cancelled or replaced while it waits. So does a run
  # for a label other than full-suite, so it cancels nothing.
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && !(github.event.action == 'labeled' && github.event.label.name != 'full-suite') && github.ref || github.run_id }}
  cancel-in-progress: true

# The shard count, the lanes in each shard, and the time each lane may take.
# A shard is one runner. A lane is one go test process, and the lanes of a
# shard run side by side on its runner. shardplan packs the tests into
# E2E_SHARDS times E2E_LANES lanes by the measured times in
# e2e/tui/shardplan/durations.txt. The shard plan job fails when a lane's
# estimate is over E2E_LANE_LIMIT, which leaves a wide margin under the 12
# minute go test timeout. The shard plan job makes the matrix from E2E_SHARDS.
env:
  E2E_SHARDS: "16"
  E2E_LANES: "2"
  E2E_LANE_LIMIT: 6m
  # A partial selection fills lanes to about this much each and leaves the
  # rest empty, so a small change does not start every runner.
  E2E_LANE_FILL: 3m

jobs:
  # The merge queue lands the exact commit its run tested, so the push to main
  # would run the same suite on the same tree again. A pull request run of the
  # whole suite on the same commit counts too. This job looks for
  # that run. When it finds one, the shards pass at once with a note that links
  # it. When it finds none, or the API fails, the shards run in full.
  tested:
    name: e2e-tui already tested
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.skip_if_tested)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    outputs:
      url: ${{ steps.find.outputs.url }}
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: scripts

      - name: Find a run that passed every shard on this commit
        id: find
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          url=$(scripts/e2e-tested.sh "$GITHUB_REPOSITORY" "$GITHUB_SHA" "$E2E_SHARDS" || true)
          echo "url=$url" >> "$GITHUB_OUTPUT"
          if [ -n "$url" ]; then
            echo "This commit passed every shard in an earlier run: $url" | tee -a "$GITHUB_STEP_SUMMARY"
          else
            echo "No earlier run passed every shard on this commit. The shards run in full." | tee -a "$GITHUB_STEP_SUMMARY"
          fi

  shard-plan:
    name: e2e-tui shard plan
    if: github.event.action != 'labeled' || github.event.label.name == 'full-suite'
    runs-on: ubuntu-latest
    outputs:
      shards: ${{ steps.shards.outputs.shards }}
      total: ${{ steps.shards.outputs.total }}
      frames: ${{ steps.frames.outputs.frames }}
      debs_key: ${{ steps.debs.outputs.key }}
      backends: ${{ steps.frames.outputs.backends }}
    # actions: read lets scripts/e2e-select.sh download the newest test map.
    permissions:
      contents: read
      actions: read
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          # A pull request checks out the merge of its head into the base, so
          # HEAD^1 is the base and HEAD^1..HEAD is exactly the change.
          fetch-depth: 2

      # The same cache as the shards: this job builds what they used to.
      - uses: ./.github/actions/setup-go
        with:
          go-version-file: e2e/tui/go.mod
          cache-id: e2e

      # The only selection of the run: the shards read its lists. all.txt
      # keeps every test, for a selection that fills every shard (below).
      - name: Select the tests this change can reach
        working-directory: e2e/tui
        env:
          TUIOS_E2E: "1"
          GH_TOKEN: ${{ github.token }}
          E2E_SELECT_ALL: ${{ runner.temp }}/all.txt
          # The full-suite label runs every test.
          E2E_SELECT_FULL: ${{ contains(github.event.pull_request.labels.*.name, 'full-suite') }}
        run: |
          set -euo pipefail
          GITHUB_OUTPUT="$RUNNER_TEMP/select.out" ../../scripts/e2e-select.sh > "$RUNNER_TEMP/selected.txt"

      # The full test list from the step above, so the suite is compiled and
      # listed once. The listing is most of the time of this job.
      - name: Check that every shard fits its time
        working-directory: e2e/tui
        run: |
          set -euo pipefail
          go run ./shardplan -shards "$((E2E_SHARDS * E2E_LANES))" -max "$E2E_LANE_LIMIT" < "$RUNNER_TEMP/all.txt"

      # The frame paths (appearance.cell_frames) and the backends the shards
      # run on. A pull request runs the default path, cells, on the real
      # binary. A pull request with the full-suite label, the merge queue and
      # a run by hand also run every shard on Bubble Tea's renderer, the other
      # path, and on the sim backend, so neither breaks unseen while both
      # exist. Such a run leaves the notice "full" titled "e2e-tui frames".
      # A push to main of a commit that passed such a run runs cells on the
      # real binary only, and the tested job finds that run for those. Any
      # other push runs all of them.
      - name: Choose the frame paths
        id: frames
        env:
          GH_TOKEN: ${{ github.token }}
          LABELED: ${{ contains(github.event.pull_request.labels.*.name, 'full-suite') }}
        run: |
          set -euo pipefail
          full=true
          case $GITHUB_EVENT_NAME in
          pull_request) [ "$LABELED" = true ] || full=false ;;
          push)
            url=$(scripts/e2e-tested.sh "$GITHUB_REPOSITORY" "$GITHUB_SHA" "$E2E_SHARDS" full || true)
            if [ -n "$url" ]; then
              full=false
              echo "This commit passed every frame path and backend in $url" | tee -a "$GITHUB_STEP_SUMMARY"
            fi
            ;;
          esac
          if $full; then
            echo "::notice title=e2e-tui frames::full"
            echo 'frames=["cells","string"]' >> "$GITHUB_OUTPUT"
            echo 'backends=["real","sim"]' >> "$GITHUB_OUTPUT"
          else
            echo 'frames=["cells"]' >> "$GITHUB_OUTPUT"
            echo 'backends=["real"]' >> "$GITHUB_OUTPUT"
          fi

      # The tests of each lane of each shard, packed by measured time
      # (shardplan). shardplan packs E2E_SHARDS times E2E_LANES lanes, and
      # shard N takes lanes (N-1)*E2E_LANES+1 to N*E2E_LANES. A test that is
      # not in the durations file yet counts as the mean. A partial selection
      # fills as few lanes as it needs, and a shard with no test does not
      # start, so a small change takes two or three runners instead of
      # sixteen. When the fill gives no shard a test, the selection spreads
      # over every shard instead. When the fill gives every shard a test, the
      # run costs the same runners as the whole suite, so the whole suite
      # runs. The push to main then finds this run and does not run it again.
      #
      # The notice "mode=all" titled "e2e-tui selection" is how
      # scripts/e2e-tested.sh knows that every test ran, so the step writes
      # it once, with the mode the shards run.
      - name: Choose the shards that run
        id: shards
        working-directory: e2e/tui
        run: |
          set -euo pipefail
          mode=$(sed -n 's/^mode=//p' "$RUNNER_TEMP/select.out")
          go build -o "$RUNNER_TEMP/shardplan" ./shardplan
          lanes=$((E2E_SHARDS * E2E_LANES))
          mkdir -p "$RUNNER_TEMP/suite"
          # pack FILL: write every lane's list, and print the shards that got a test.
          pack() {
            local shard lane v n f
            for shard in $(seq 1 "$E2E_SHARDS"); do
              n=0
              for lane in $(seq 1 "$E2E_LANES"); do
                v=$(( (shard - 1) * E2E_LANES + lane ))
                f="$RUNNER_TEMP/suite/names-$shard-$lane.txt"
                if [ "$mode" = none ]; then
                  : > "$f"
                else
                  "$RUNNER_TEMP/shardplan" -shards "$lanes" -shard "$v" "$@" < "$RUNNER_TEMP/selected.txt" | grep . > "$f" || true
                fi
                n=$((n + $(grep -c . "$f" || true)))
              done
              if [ "$n" -gt 0 ]; then
                echo "$shard"
              elif [ "$mode" = all ]; then
                echo "shard $shard of $E2E_SHARDS matched no tests, which means the split is broken" >&2
                exit 1
              fi
            done
          }
          if [ "$mode" = some ]; then
            pack -fill "$E2E_LANE_FILL" > "$RUNNER_TEMP/shards.txt"
            if [ ! -s "$RUNNER_TEMP/shards.txt" ]; then
              echo "::warning title=Shard plan::The selection holds tests but no shard got one, so they spread over every shard."
              pack > "$RUNNER_TEMP/shards.txt"
            elif [ "$(grep -c . "$RUNNER_TEMP/shards.txt")" -eq "$E2E_SHARDS" ]; then
              echo "The selection of $(grep -c . "$RUNNER_TEMP/selected.txt") of $(grep -c . "$RUNNER_TEMP/all.txt") tests fills every shard, so every test runs." | tee -a "$GITHUB_STEP_SUMMARY"
              mode=all
              cp "$RUNNER_TEMP/all.txt" "$RUNNER_TEMP/selected.txt"
              pack > "$RUNNER_TEMP/shards.txt"
            fi
          else
            pack > "$RUNNER_TEMP/shards.txt"
          fi
          # Every lane computes its list in a shardplan run of its own, so the
          # lanes hold each selected test once only if every run packs the
          # same plan. Check that here, before a shard starts.
          if [ "$mode" != none ]; then
            grep -h '^Test' "$RUNNER_TEMP/selected.txt" | sort -u > "$RUNNER_TEMP/want.txt"
            cat "$RUNNER_TEMP"/suite/names-*.txt | sort > "$RUNNER_TEMP/packed.txt"
            if ! cmp -s "$RUNNER_TEMP/want.txt" "$RUNNER_TEMP/packed.txt"; then
              echo "::error title=Shard plan::The lanes do not hold each selected test once. In two lanes or more: $(uniq -d "$RUNNER_TEMP/packed.txt" | wc -l). In no lane: $(comm -23 "$RUNNER_TEMP/want.txt" <(sort -u "$RUNNER_TEMP/packed.txt") | wc -l)."
              exit 1
            fi
          fi
          echo "::notice title=e2e-tui selection::mode=$mode"
          mapfile -t shards < "$RUNNER_TEMP/shards.txt"
          list=$(IFS=,; echo "${shards[*]:-}")
          echo "shards=[$list]" >> "$GITHUB_OUTPUT"
          echo "total=$E2E_SHARDS" >> "$GITHUB_OUTPUT"
          echo "Shards that run: ${list:-none} of $E2E_SHARDS" | tee -a "$GITHUB_STEP_SUMMARY"

      # The binary under test and a test binary for each package of the
      # suite, built once here. Each shard used to list and compile the
      # suite itself, about 50 seconds of its runner. The test listing above
      # built the packages, so this step mostly links. A draft starts no
      # shard, so it builds nothing.
      - name: Build the binary under test and the suite
        if: steps.shards.outputs.shards != '[]' && (github.event_name != 'pull_request' || !github.event.pull_request.draft)
        run: |
          set -euo pipefail
          out=$RUNNER_TEMP/suite
          GOFLAGS="$(scripts/goflags.sh)" go build -o "$out/tuios" ./cmd/tuios
          cd e2e/tui
          # packages.txt: the test binary, the package's folder under
          # e2e/tui, and its import path, one package a line.
          : > "$out/packages.txt"
          go list -f '{{if or .TestGoFiles .XTestGoFiles}}{{.ImportPath}} {{.Dir}}{{end}}' ./... | while read -r pkg dir; do
            rel=$(realpath --relative-to=. "$dir")
            bin=$(echo "$rel" | tr ./ __).test
            go test -c -o "$out/$bin" "./$rel"
            echo "$bin $rel $pkg" >> "$out/packages.txt"
          done
          cat "$out/packages.txt"
          du -sh "$out"

      # The apt packages the shards' tests may need, as .deb files, so a
      # shard installs them with dpkg and runs no apt-get. Each package's
      # folder holds the files it needs beyond the runner image. The key names
      # the runner image version, which fixes the version of each package,
      # and the packages. Only a miss downloads them, once, here.
      - name: Name the shard tools cache
        id: debs
        if: steps.shards.outputs.shards != '[]' && (github.event_name != 'pull_request' || !github.event.pull_request.draft)
        run: |
          pkgs="fish zsh lua5.1 poppler-utils"
          echo "pkgs=$pkgs" >> "$GITHUB_OUTPUT"
          echo "key=e2e-debs-$ImageOS-$ImageVersion-${pkgs// /-}" >> "$GITHUB_OUTPUT"

      - name: Look up the shard tools cache
        id: debs-cache
        if: steps.shards.outputs.shards != '[]' && (github.event_name != 'pull_request' || !github.event.pull_request.draft)
        uses: actions/cache/restore@v6
        with:
          path: ${{ runner.temp }}/debs
          key: ${{ steps.debs.outputs.key }}
          lookup-only: true

      - name: Download the shard tools
        if: steps.shards.outputs.shards != '[]' && (github.event_name != 'pull_request' || !github.event.pull_request.draft) && steps.debs-cache.outputs.cache-hit != 'true'
        env:
          PKGS: ${{ steps.debs.outputs.pkgs }}
        run: |
          set -euo pipefail
          # With no package the script only repairs the apt sources.
          .github/scripts/apt-install.sh
          sudo apt-get -o Acquire::Retries=3 update -qq
          for pkg in $PKGS; do
            dir=$RUNNER_TEMP/debs/$pkg
            mkdir -p "$dir/partial"
            sudo apt-get -o Acquire::Retries=3 install -y -qq --no-install-recommends --download-only -o Dir::Cache::archives="$dir" "$pkg"
            sudo rm -rf "$dir/partial" "$dir/lock"
            sudo chown -R "$(id -u):$(id -g)" "$dir"
            echo "$pkg: $(ls "$dir" | tr '\n' ' ')"
          done

      - name: Save the shard tools
        if: steps.shards.outputs.shards != '[]' && (github.event_name != 'pull_request' || !github.event.pull_request.draft) && steps.debs-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: ${{ runner.temp }}/debs
          key: ${{ steps.debs.outputs.key }}

      - name: Keep the build and the lists for the shards
        if: steps.shards.outputs.shards != '[]' && (github.event_name != 'pull_request' || !github.event.pull_request.draft)
        uses: actions/upload-artifact@v7
        with:
          name: e2e-suite
          path: ${{ runner.temp }}/suite
          if-no-files-found: error
          # A rerun of a failed shard reads it again.
          retention-days: 3
          overwrite: true

  e2e-tui:
    runs-on: ubuntu-latest
    # actions: read lets scripts/e2e-select.sh download the newest test map.
    permissions:
      contents: read
      actions: read
    # The suite spawns multiplexer daemons and shells. The job timeout is a
    # backstop; every individual wait inside the suite has its own deadline, so
    # a hang is reported as the assertion that timed out rather than as a job
    # that was killed.
    #
    # The suite is split across runners because it grew past a single one. It
    # ran about 1000 seconds in one process against a 900 second test timeout,
    # and a runner is slower, so three commits in a row were killed rather than
    # failed. A kill prints no failing test, which is the worst shape a red
    # build can take.
    #
    # The tests hold no t.Parallel: each one starts a real daemon and a real
    # pseudo-terminal, and tests in one process share its environment and
    # globals. Each shard runs E2E_LANES go test processes side by side
    # instead, each with a list of its own. The tests mostly wait on a pty or
    # a daemon: a serial run used about one CPU second in five of its wall
    # time, so two lanes on a four-core runner do twice the work in about the
    # same time. Four lanes were tried: the runner stayed about two thirds
    # idle on average, but the bursts made one to two timing-sensitive tests
    # fail in four of seven full runs. Tests that must not overlap share a
    # lane through e2e/tui/shardplan/together.txt.
    #
    # The split was a hash of the test name until seven shards ran between 525
    # and 1054 seconds, and the long one crossed the 1080 second timeout. A
    # hash balances the count of tests, and a few tests take a minute or two.
    # The split is now by measured time, with sixteen shards of two lanes near
    # five minutes each (twelve until the suite outgrew them, 2026-11-09, and
    # fourteen until 2026-11-12, when the lanes were within seconds of the limit).
    #
    # The shard plan job names the shards that get a test, and only those
    # start. It also selects and packs the tests and builds the binaries, so
    # a shard downloads them and runs its lanes.
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.shard-plan.outputs.shards) }}
        frame: ${{ fromJSON(needs.shard-plan.outputs.frames) }}
        # real runs the built binary. sim runs the client and the daemon in
        # the test process (e2e/tui/backend_test.go), on the cells path only,
        # and only the tests in e2e/tui/shardplan/sim.txt: the ones that pass
        # there. A pull request runs real only: a red sim shard would block
        # every landing. The merge queue and a run by hand add sim, as a check
        # that is not required, so the queue builds the record of three green
        # days that makes sim a check.
        backend: ${{ fromJSON(needs.shard-plan.outputs.backends) }}
        exclude:
          - frame: string
            backend: sim
    # The default path keeps the name the checks have always had.
    name: e2e-tui (shard ${{ matrix.shard }} of ${{ needs.shard-plan.outputs.total }})${{ matrix.frame == 'string' && ', string frames' || '' }}${{ matrix.backend == 'sim' && ', sim' || '' }}
    needs: [tested, shard-plan]
    # tested is skipped on a pull request, so the shards must not wait for its
    # success. A draft skips the shards.
    if: ${{ !cancelled() && needs.shard-plan.result == 'success' && needs.shard-plan.outputs.shards != '[]' && (github.event_name != 'pull_request' || !github.event.pull_request.draft) }}
    timeout-minutes: 20
    # A red sim shard does not fail the run or the e2e-tui result check.
    continue-on-error: ${{ matrix.backend == 'sim' }}
    env:
      # Only the real cells shards are skipped for a commit that passed them
      # before. The string and sim shards run wherever the frame step put
      # them.
      TESTED_URL: ${{ matrix.frame == 'cells' && matrix.backend == 'real' && needs.tested.outputs.url || '' }}

    steps:
      - name: Already passed on the pull request
        if: env.TESTED_URL != ''
        run: |
          echo "::notice title=e2e already passed::This commit passed every shard as a pull request head: $TESTED_URL"
          echo "Not run again. This commit passed every shard as a pull request head: $TESTED_URL" >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/checkout@v7
        if: env.TESTED_URL == ''
        with:
          fetch-depth: 2

      - uses: ./.github/actions/setup-go
        if: env.TESTED_URL == ''
        with:
          # The nested e2e module asks for a newer Go than the root module, and
          # this job needs both: it builds cmd/tuios from the root and then runs
          # the suite from e2e/tui. Installing the higher of the two satisfies
          # each, since a module's go directive is a minimum. Reading the root
          # go.mod here used to work only because Go quietly fetched the newer
          # toolchain when the tests ran, which setup-go now prevents by pinning
          # GOTOOLCHAIN to what it installed.
          go-version-file: e2e/tui/go.mod
          cache-id: e2e

      # The shard plan job selected the tests, packed them into lanes, and
      # built the binary under test and the suite. This shard reads its own
      # lanes' lists from that build.
      - uses: actions/download-artifact@v8
        if: env.TESTED_URL == ''
        with:
          name: e2e-suite
          path: ${{ runner.temp }}/suite

      - name: Choose this shard's tests
        id: plan
        if: env.TESTED_URL == ''
        working-directory: e2e/tui
        env:
          SHARD: ${{ matrix.shard }}
          BACKEND: ${{ matrix.backend }}
        run: |
          set -euo pipefail
          # An artifact keeps no file modes.
          chmod +x "$RUNNER_TEMP/suite/tuios" "$RUNNER_TEMP"/suite/*.test
          for lane in $(seq 1 "$E2E_LANES"); do
            grep . "$RUNNER_TEMP/suite/names-$SHARD-$lane.txt" > "$RUNNER_TEMP/names-$lane.txt" || true
            # The sim shard keeps the tests of its lanes that pass in process.
            if [ "$BACKEND" = sim ]; then
              grep -xF -f <(grep -v '^#' shardplan/sim.txt | grep .) "$RUNNER_TEMP/names-$lane.txt" > "$RUNNER_TEMP/sim-$lane.txt" || true
              mv "$RUNNER_TEMP/sim-$lane.txt" "$RUNNER_TEMP/names-$lane.txt"
            fi
          done
          cat "$RUNNER_TEMP"/names-*.txt > "$RUNNER_TEMP/names.txt"
          if [ -s "$RUNNER_TEMP/names.txt" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            wc -l < "$RUNNER_TEMP/names.txt" | xargs printf 'shard %s of %s runs %s tests\n' "$SHARD" "$E2E_SHARDS"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=No e2e tests in this shard::The change reaches no test this shard would run."
            echo "This shard runs no tests: the change reaches none of the tests it would run." >> "$GITHUB_STEP_SUMMARY"
          fi

      # A test that needs fish, zsh, Lua or jj is named in e2e/tui/tools.txt, which
      # TestToolsListMatchesTheTests checks against the source, so no list of
      # names lives here. Only a shard that holds one of those tests pays for
      # its packages. The test step sets TUIOS_E2E_REQUIRE_TOOLS, so a tool
      # that is still missing fails the test and does not skip it.
      #
      # TestRailQuickLookKittyPicture resizes a PDF page, the case the bug was
      # reported on, and skips that step without pdftoppm (poppler-utils).
      - name: Choose the tools this shard's tests need
        id: tools
        if: env.TESTED_URL == '' && steps.plan.outputs.run == 'true'
        run: |
          set -euo pipefail
          tools=$(awk 'NR == FNR { want[$1] = 1; next } /^#/ || NF < 2 { next } ($1 in want) { for (i = 2; i <= NF; i++) print $i }' "$RUNNER_TEMP/names.txt" e2e/tui/tools.txt | sort -u)
          pkgs=()
          need_jj=
          for tool in $tools; do
            case $tool in
            fish) pkgs+=(fish) ;;
            zsh) pkgs+=(zsh) ;;
            # Lua 5.1, the version Rex embeds. The package puts lua on PATH.
            lua) pkgs+=(lua5.1) ;;
            jj) need_jj=1 ;;
            *) echo "e2e/tui/tools.txt names the tool $tool, which this step does not know how to install" >&2; exit 1 ;;
            esac
          done
          if grep -qx 'TestRailQuickLookKittyPicture' "$RUNNER_TEMP/names.txt"; then
            pkgs+=(poppler-utils)
          fi
          echo "pkgs=${pkgs[*]:-}" >> "$GITHUB_OUTPUT"
          echo "jj=$need_jj" >> "$GITHUB_OUTPUT"

      # The .deb files the shard plan job keeps for this runner image.
      - name: Restore the shard tools
        id: debs
        if: env.TESTED_URL == '' && steps.tools.outputs.pkgs != ''
        uses: actions/cache/restore@v6
        with:
          path: ${{ runner.temp }}/debs
          key: ${{ needs.shard-plan.outputs.debs_key }}

      - name: Install the tools this shard's tests need
        if: env.TESTED_URL == '' && steps.plan.outputs.run == 'true'
        env:
          PKGS: ${{ steps.tools.outputs.pkgs }}
          NEED_JJ: ${{ steps.tools.outputs.jj }}
          DEBS_HIT: ${{ steps.debs.outputs.cache-hit }}
        run: |
          set -euo pipefail
          if [ -n "$PKGS" ]; then
            start=$(date +%s)
            if [ "$DEBS_HIT" = true ]; then
              # Each package's folder holds the files it needs beyond the
              # runner image. One dpkg call installs them in order. A file
              # that two packages need is installed once.
              # shellcheck disable=SC2086 # one package name a word
              debs=$(for pkg in $PKGS; do ls "$RUNNER_TEMP/debs/$pkg"/*.deb 2>/dev/null || true; done | awk -F/ '!seen[$NF]++')
              if [ -n "$debs" ]; then
                # shellcheck disable=SC2086 # one path a line, none with a space
                sudo dpkg -i $debs > "$RUNNER_TEMP/dpkg.log" 2>&1 || { cat "$RUNNER_TEMP/dpkg.log"; exit 1; }
              fi
              echo "Installed $PKGS from the cache in $(( $(date +%s) - start )) s"
            else
              # The runner image is newer or older than the one the shard
              # plan job ran on, or the cache was evicted.
              echo "::warning title=Shard tools::The tools cache has no files for this runner image, so apt installs $PKGS."
              # shellcheck disable=SC2086 # one package name a word
              .github/scripts/apt-install.sh $PKGS
              echo "Installed $PKGS with apt in $(( $(date +%s) - start )) s"
            fi
            command -v pdftoppm >/dev/null && pdftoppm -v 2>&1 | head -1 || true
          fi
          # jj has no apt package on the runner. A release binary at the
          # version the tests were written against, checked against its
          # sha256 (the digest GitHub shows for the asset), so a changed
          # jj is a change in this file. The musl build is static.
          if [ -n "$NEED_JJ" ]; then
            jj_version=0.47.1
            jj_sha256=d4b657f622ee50929c8916466dfa3d6a6c17a0a32b50e7b2c793707ec9ebcad7
            asset="jj-v${jj_version}-x86_64-unknown-linux-musl.tar.gz"
            mkdir -p "$RUNNER_TEMP/jjbin"
            curl -fsSL --retry 3 -o "$RUNNER_TEMP/$asset" "https://github.com/jj-vcs/jj/releases/download/v${jj_version}/${asset}"
            echo "${jj_sha256}  $RUNNER_TEMP/$asset" | sha256sum -c -
            tar -xzf "$RUNNER_TEMP/$asset" -C "$RUNNER_TEMP/jjbin" ./jj
            echo "$RUNNER_TEMP/jjbin" >> "$GITHUB_PATH"
            "$RUNNER_TEMP/jjbin/jj" --version
          fi

      - name: Run this shard of the end-to-end suite
        if: env.TESTED_URL == '' && steps.plan.outputs.run == 'true'
        working-directory: e2e/tui
        env:
          TUIOS_E2E: "1"
          # A tool the shard's tests need that is not installed fails the
          # test. Without this a missing tool skips it without a word.
          TUIOS_E2E_REQUIRE_TOOLS: "1"
          # -count=1 is enforced on the command line too, but pointing the suite
          # at an explicit binary keeps the build step's output out of the test
          # log and makes the artifact obvious.
          TUIOS_E2E_BIN: ${{ runner.temp }}/suite/tuios
          SHARD: ${{ matrix.shard }}
          # The harness forwards it to every client: 0 is Bubble Tea's
          # renderer, and empty leaves the default, cells.
          TUIOS_CELL_FRAME: ${{ matrix.frame == 'string' && '0' || '' }}
          TUIOS_E2E_BACKEND: ${{ matrix.backend }}
          # tuitest records each terminal as asciicast v2 and writes the
          # recording of a failed test here. The step below uploads them.
          TUITEST_CAST_DIR: /tmp/tuios-e2e-casts
        # -count=1 defeats Go's test cache, which otherwise can replay a stale
        # result across a change of binary. -race is deliberately absent: the
        # program under test is a child process, so the detector would
        # instrument only the harness.
        #
        # The lanes write to a log each, and the logs print one after another
        # when every lane is done, so no two lanes' lines interleave.
        run: |
          set -euo pipefail
          start=$SECONDS
          # How busy the runner is while the lanes run, for tuning E2E_LANES.
          vmstat -n 5 > "$RUNNER_TEMP/vmstat.log" &
          vmstat_pid=$!
          # Each lane runs the test binaries the shard plan job built, each in
          # its package's folder as go test would, and prints go test's
          # summary line after each.
          suite() { # NAMES: run the tests named by the pattern in every package.
            local bin rel pkg t s status=0
            while read -r bin rel pkg; do
              t=$SECONDS
              s=0
              (cd "$rel" && "$RUNNER_TEMP/suite/$bin" -test.count=1 -test.timeout 12m -test.v -test.run "^($1)$") || s=$?
              if [ "$s" -eq 0 ]; then
                printf 'ok  \t%s\t%ds\n' "$pkg" "$((SECONDS - t))"
              else
                printf 'FAIL\t%s\t%ds\n' "$pkg" "$((SECONDS - t))"
                status=1
              fi
            done < "$RUNNER_TEMP/suite/packages.txt"
            return "$status"
          }
          pids=()
          for lane in $(seq 1 "$E2E_LANES"); do
            [ -s "$RUNNER_TEMP/names-$lane.txt" ] || continue
            names=$(paste -sd'|' "$RUNNER_TEMP/names-$lane.txt")
            (
              lstart=$SECONDS
              lstatus=0
              suite "$names" > "$RUNNER_TEMP/e2e-$lane.log" 2>&1 || lstatus=$?
              echo "$lstatus" > "$RUNNER_TEMP/status-$lane"
              echo "$((SECONDS - lstart))" > "$RUNNER_TEMP/took-$lane"
            ) &
            pids+=("$!")
          done
          wait "${pids[@]}"
          kill "$vmstat_pid" || true
          awk 'NR > 3 { n++; idle += $15; wa += $16; if ($1 > r) r = $1 }
            END { if (n) printf "runner while the lanes ran: %d%% idle, %d%% io wait, run queue up to %d\n", idle / n, wa / n, r }' "$RUNNER_TEMP/vmstat.log"
          # A failed test fails the shard. No test runs twice.
          status=0
          limit=$(( ${E2E_LANE_LIMIT%m} * 60 ))
          for lane in $(seq 1 "$E2E_LANES"); do
            [ -s "$RUNNER_TEMP/names-$lane.txt" ] || continue
            took=$(cat "$RUNNER_TEMP/took-$lane")
            lstatus=$(cat "$RUNNER_TEMP/status-$lane")
            echo "=== lane $lane of shard $SHARD: $(wc -l < "$RUNNER_TEMP/names-$lane.txt") tests, ${took}s, exit $lstatus"
            cat "$RUNNER_TEMP/e2e-$lane.log"
            [ "$lstatus" = 0 ] || status=1
            # A lane that ran over the limit still passes, but says so, so the
            # drift shows before it reaches the timeout.
            if [ "$took" -gt "$limit" ]; then
              echo "::warning title=Slow e2e lane::Lane $lane of shard $SHARD ran ${took}s, over the $E2E_LANE_LIMIT limit. Refresh e2e/tui/shardplan/durations.txt or add a shard."
            fi
          done
          echo "shard $SHARD ran in $((SECONDS - start))s"
          exit "$status"

      # A failed test copies its frames to /tmp/tuios-e2e-artifacts/TESTNAME
      # (keepFailedArtifacts in e2e/tui). Keep that folder when the shard
      # fails, so the screens that failed can be read without a rerun.
      - name: Keep the frames of the failed tests
        if: failure() && env.TESTED_URL == '' && steps.plan.outputs.run == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: e2e-tui-frames-shard-${{ matrix.shard }}-${{ matrix.frame }}-${{ matrix.backend }}
          path: /tmp/tuios-e2e-artifacts
          if-no-files-found: ignore
          retention-days: 3

      # The asciicast recording of each failed test, with a mark for every
      # wait and input. Play one with asciinema play FILE.
      - name: Keep the recordings of the failed tests
        if: failure() && env.TESTED_URL == '' && steps.plan.outputs.run == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: e2e-tui-casts-shard-${{ matrix.shard }}-${{ matrix.frame }}-${{ matrix.backend }}
          path: /tmp/tuios-e2e-casts
          if-no-files-found: ignore
          retention-days: 3

      - name: Reap any surviving daemons
        # The harness tears down its own process groups, but a hard job failure
        # can leave one behind, and a leaked daemon would poison a self-hosted
        # runner. Never fail the job on this.
        if: always() && env.TESTED_URL == '' && steps.plan.outputs.run == 'true'
        run: pkill -f "$RUNNER_TEMP/suite/tuios" || true

  # The one check of this workflow that landing waits for. A pull request
  # starts only the shards its selection fills, so a shard is not a check that
  # can be required by name. A run for a label other than full-suite skips it.
  # The sim shards may fail (continue-on-error above) until
  # e2e/tui/shardplan/sim.txt is green. A cancelled run skips it.
  e2e-result:
    name: e2e-tui result
    if: ${{ !cancelled() && (github.event.action != 'labeled' || github.event.label.name == 'full-suite') }}
    needs: [shard-plan, e2e-tui]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Every shard passed or was not needed
        env:
          PLAN: ${{ needs.shard-plan.result }}
          SHARDS: ${{ needs.e2e-tui.result }}
        run: |
          echo "shard plan: $PLAN, shards: $SHARDS"
          [ "$PLAN" = success ] || exit 1
          case $SHARDS in success | skipped) ;; *) exit 1 ;; esac
