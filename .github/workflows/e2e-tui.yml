name: End-to-end TUI regressions

# Drives a real tuios binary in a real PTY and asserts on the rendered screen.
# No terminal is needed: the harness allocates the pty itself, so this runs on a
# stock runner with no xvfb or tmux.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  e2e-tui:
    runs-on: ubuntu-latest
    # The suite spawns multiplexer daemons and shells. The job timeout is a
    # backstop; every individual wait inside the suite has its own deadline, so
    # a hang is reported as the assertion that timed out rather than as a job
    # that was killed.
    #
    # The suite is split across runners because it grew past a single one. It
    # ran about 1000 seconds in one process against a 900 second test timeout,
    # and a runner is slower, so three commits in a row were killed rather than
    # failed. A kill prints no failing test, which is the worst shape a red
    # build can take.
    #
    # The tests hold no t.Parallel, and they should not: each one starts a real
    # daemon and a real pseudo-terminal, so running them together inside one
    # process would multiply the memory rather than the throughput. Splitting
    # across machines gives each shard the whole runner.
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    name: e2e-tui (shard ${{ matrix.shard }} of 4)
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          # The nested e2e module asks for a newer Go than the root module, and
          # this job needs both: it builds cmd/tuios from the root and then runs
          # the suite from e2e/tui. Installing the higher of the two satisfies
          # each, since a module's go directive is a minimum. Reading the root
          # go.mod here used to work only because Go quietly fetched the newer
          # toolchain when the tests ran, which setup-go now prevents by pinning
          # GOTOOLCHAIN to what it installed.
          go-version-file: e2e/tui/go.mod
          cache-dependency-path: |
            go.sum
            e2e/tui/go.sum

      - name: Build the binary under test
        run: go build -o "$RUNNER_TEMP/tuios" ./cmd/tuios

      - name: Run this shard of the end-to-end suite
        working-directory: e2e/tui
        env:
          TUIOS_E2E: "1"
          # -count=1 is enforced on the command line too, but pointing the suite
          # at an explicit binary keeps the build step's output out of the test
          # log and makes the artifact obvious.
          TUIOS_E2E_BIN: ${{ runner.temp }}/tuios
          SHARD: ${{ matrix.shard }}
          SHARDS: "4"
        # The split is by a hash of the test name, not by the order the list
        # comes back in, so adding or renaming a test moves only that test
        # between shards instead of resegmenting every one of them.
        #
        # Listing needs TUIOS_E2E as well: without it the suite's TestMain
        # returns before it can print a name, and the shard would silently be
        # empty.
        #
        # -count=1 defeats Go's test cache, which otherwise can replay a stale
        # result across a change of binary. -race is deliberately absent: the
        # program under test is a child process, so the detector would
        # instrument only the harness.
        run: |
          set -euo pipefail
          names=$(go test -list '^Test' ./... | grep '^Test' | sort | awk -v n="$SHARD" -v t="$SHARDS" '
            { h = 0
              for (i = 1; i <= length($0); i++) h = (h * 31 + index("abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789_", substr($0, i, 1))) % 1000003 }
            (h % t) == (n - 1) { print }')
          if [ -z "$names" ]; then
            echo "shard $SHARD of $SHARDS matched no tests, which means the split is broken" >&2
            exit 1
          fi
          echo "$names" | wc -l | xargs printf 'shard %s of %s runs %s tests\n' "$SHARD" "$SHARDS"
          go test -count=1 -timeout 18m -v -run "^($(echo "$names" | paste -sd'|' -))$" ./...

      - name: Reap any surviving daemons
        # The harness tears down its own process groups, but a hard job failure
        # can leave one behind, and a leaked daemon would poison a self-hosted
        # runner. Never fail the job on this.
        if: always()
        run: pkill -f "$RUNNER_TEMP/tuios" || true
