name: Lint

# Static analysis on every pull request: golangci-lint with the repository's
# .golangci.yml, govulncheck for known vulnerabilities in code tuios reaches,
# and go vet on the platforms the release builds for but no test job runs on.
# The unit test workflow covers gofmt, tidy and vet on linux.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  golangci:
    name: golangci-lint
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          # A cache key of its own, rather than racing the unit test job for
          # the plain go.sum key (see go-test.yml).
          cache-dependency-path: |
            go.sum
            .golangci.yml

      - uses: golangci/golangci-lint-action@v9
        with:
          # Pinned, so a new linter release cannot fail a pull request that
          # changed nothing. Bump it on purpose.
          version: v2.14.0
          args: --timeout 20m

      # ./... stops at a nested module, so each Go library of this repository
      # is linted from its own folder, with the same .golangci.yml.
      - name: golangci-lint (progstatus)
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.14.0
          working-directory: progstatus
          args: --timeout 10m

      - name: golangci-lint (vt)
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.14.0
          working-directory: vt
          args: --timeout 10m

      - name: golangci-lint (swatch)
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.14.0
          working-directory: swatch
          args: --timeout 10m

      - name: golangci-lint (shot)
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.14.0
          working-directory: shot
          args: --timeout 10m

      - name: golangci-lint (tml)
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.14.0
          working-directory: tml
          args: --timeout 10m

  bom:
    name: no byte order mark in Go files
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7

      # Go refuses a U+FEFF anywhere but the first bytes of a file ("illegal
      # byte order mark"). Some editors and agent tools turn a \uFEFF escape
      # into the literal character, so this names the file before the build
      # does. Write the escape "\xef\xbb\xbf" instead.
      - name: Find a literal U+FEFF after the first bytes
        run: |
          bad=$(git ls-files -z '*.go' | xargs -0 perl -0777 -ne 'print "$ARGV\n" if /.\xef\xbb\xbf/s')
          if [ -n "$bad" ]; then
            echo "These Go files hold a literal byte order mark. Write \\xef\\xbb\\xbf instead:" >&2
            echo "$bad" >&2
            exit 1
          fi

  govulncheck:
    name: govulncheck
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      # The go.mod toolchain line sets the stdlib that govulncheck scans. The
      # govulncheck action ignores go-version-file and installs "stable".
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false

      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...

  cross-vet:
    name: go vet (${{ matrix.goos }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # The release targets besides linux, which go-test.yml vets. A test
        # file that uses a unix-only syscall without a build tag breaks these
        # and nothing else.
        goos: [darwin, windows, freebsd, openbsd]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache-dependency-path: |
            go.sum
            .github/workflows/lint.yml

      - name: Vet
        env:
          GOOS: ${{ matrix.goos }}
        run: go vet ./... ./progstatus/... ./vt/... ./swatch/... ./shot/... ./tml/...
