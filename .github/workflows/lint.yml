name: Lint

# Static analysis on every pull request: golangci-lint with the repository's
# .golangci.yml, govulncheck for known vulnerabilities in code tuios reaches,
# go vet on the platforms the release builds for but no test job runs on, and
# goimports, gopls and the go fix modernizers on the files a pull request
# changed (scripts/check.sh, which `just check` runs locally).
# The unit test workflow covers gofmt, tidy and vet on linux.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # A pull request's group is its ref, so a newer push cancels the run in
  # progress. Every other run (main, the nightly, a manual run) gets a group of
  # its own and is never cancelled or replaced while it waits.
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: true

jobs:
  golangci:
    name: golangci-lint
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup-go
        with:
          go-version-file: go.mod
          cache-id: lint

      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          # Pinned, so a new linter release cannot fail a pull request that
          # changed nothing. Bump it on purpose.
          version: v2.14.0
          args: --timeout 20m

      # ./... stops at a nested module, so each Go library of this repository
      # is linted from its own folder, with the same .golangci.yml.
      - name: golangci-lint (progstatus)
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.14.0
          working-directory: progstatus
          args: --timeout 10m

      - name: golangci-lint (vt)
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.14.0
          working-directory: vt
          args: --timeout 10m

      - name: golangci-lint (swatch)
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.14.0
          working-directory: swatch
          args: --timeout 10m

      - name: golangci-lint (shot)
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.14.0
          working-directory: shot
          args: --timeout 10m

      - name: golangci-lint (tml)
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.14.0
          working-directory: tml
          args: --timeout 10m

      - name: golangci-lint (plot)
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.14.0
          working-directory: plot
          args: --timeout 10m

      - name: golangci-lint (loom)
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.14.0
          working-directory: loom
          args: --timeout 10m

      - name: golangci-lint (sketch)
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.14.0
          working-directory: sketch
          args: --timeout 10m

  bom:
    name: no byte order mark in Go files
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7

      # Go refuses a U+FEFF anywhere but the first bytes of a file ("illegal
      # byte order mark"). Some editors and agent tools turn a \uFEFF escape
      # into the literal character, so this names the file before the build
      # does. Write the escape "\xef\xbb\xbf" instead.
      - name: Find a literal U+FEFF after the first bytes
        run: |
          bad=$(git ls-files -z '*.go' | xargs -0 perl -0777 -ne 'print "$ARGV\n" if /.\xef\xbb\xbf/s')
          if [ -n "$bad" ]; then
            echo "These Go files hold a literal byte order mark. Write \\xef\\xbb\\xbf instead:" >&2
            echo "$bad" >&2
            exit 1
          fi

  sanity:
    name: goimports, gopls and modernizers (changed files)
    # The parts of scripts/check.sh no other job runs, on the files the pull
    # request changed: goimports, gopls check, and the go fix modernizers as a
    # report. gofmt, tidy, vet, golangci-lint and govulncheck have jobs of
    # their own.
    #
    # On main it checks the last commit. That also builds the pinned gopls and
    # goimports into the shared cache, which pull requests only restore.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          # The merge base with the target branch decides what changed.
          fetch-depth: 0

      - uses: ./.github/actions/setup-go
        with:
          go-version-file: go.mod
          cache-id: sanity

      - name: Check the changed files
        env:
          BASE: ${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || 'HEAD~1' }}
        run: scripts/check.sh --changed "$BASE" --only fmt,fix,gopls

      - name: Report the modernizers
        if: always()
        run: |
          if [ -s .dev/check/fix.log ]; then
            {
              echo "### go fix modernizers on the changed packages"
              echo
              echo "These do not fail the check. Read each one before you apply it."
              echo
              echo '```'
              head -n 200 .dev/check/fix.log
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi

  govulncheck:
    name: govulncheck
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      # The go.mod toolchain line sets the stdlib that govulncheck scans. The
      # govulncheck action ignores go-version-file and installs "stable".
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: false

      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...

  cross-vet:
    name: go vet (${{ matrix.goos }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # The release targets besides linux, which go-test.yml vets. A test
        # file that uses a unix-only syscall without a build tag breaks these
        # and nothing else.
        goos: [darwin, windows, freebsd, openbsd]
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup-go
        with:
          go-version-file: go.mod
          cache-id: vet-${{ matrix.goos }}

      - name: Vet
        env:
          GOOS: ${{ matrix.goos }}
        run: go vet ./... ./progstatus/... ./vt/... ./swatch/... ./shot/... ./tml/... ./plot/... ./loom/... ./sketch/...
