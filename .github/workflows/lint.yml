name: Lint

# Static analysis on every pull request: golangci-lint with the repository's
# .golangci.yml, govulncheck for known vulnerabilities in code tuios reaches,
# go vet on the platforms the release builds for but no test job runs on, and
# goimports, gopls and the go fix modernizers on the files a pull request
# changed (scripts/check.sh, which `just check` runs locally).
# The unit test workflow covers gofmt, tidy and vet on linux.

on:
  push:
    branches: [main]
  pull_request:
    paths-ignore:
      # Files that no Go build, Go test or e2e test reads. A pull request
      # that changes only these starts none of this workflow's jobs. Main
      # still runs everything.
      - "*.md"
      - "e2e/tui/*.md"
      - "assets/**"
      - ".github/ISSUE_TEMPLATE/**"
      - ".github/PULL_REQUEST_TEMPLATE/**"
      - ".github/contributors-exclude"
      - "LICENSE"
      - "CITATION.cff"
      # docs/ too: the unit tests of cmd/tuios and internal/session read
      # docs/CLI_REFERENCE.md and others, so go-test.yml keeps running for it.
      - "docs/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # A pull request's group is its ref, so a newer push cancels the run in
  # progress. Every other run (main, the nightly, a manual run) gets a group of
  # its own and is never cancelled or replaced while it waits.
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: true

jobs:
  golangci:
    name: golangci-lint
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup-go
        with:
          go-version-file: go.mod
          cache-id: lint

      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          # Pinned, so a new linter release cannot fail a pull request that
          # changed nothing. Bump it on purpose.
          version: v2.14.0
          args: --timeout 20m

      # ./... stops at a nested module, so each Go library of this repository
      # is linted from its own folder, with the same .golangci.yml.
      - name: golangci-lint (progstatus)
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.14.0
          working-directory: progstatus
          args: --timeout 10m

      - name: golangci-lint (vt)
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.14.0
          working-directory: vt
          args: --timeout 10m

      - name: golangci-lint (swatch)
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.14.0
          working-directory: swatch
          args: --timeout 10m

      - name: golangci-lint (shot)
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.14.0
          working-directory: shot
          args: --timeout 10m

      - name: golangci-lint (tml)
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.14.0
          working-directory: tml
          args: --timeout 10m

      - name: golangci-lint (plot)
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.14.0
          working-directory: plot
          args: --timeout 10m

      - name: golangci-lint (loom)
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.14.0
          working-directory: loom
          args: --timeout 10m

      - name: golangci-lint (sketch)
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.14.0
          working-directory: sketch
          args: --timeout 10m

  sanity:
    name: govulncheck, BOM, goimports, gopls and modernizers
    # Small checks that each took longer to set up than to run, in one job:
    #
    #   - no literal byte order mark in a Go file;
    #   - govulncheck for known vulnerabilities in code tuios reaches;
    #   - the parts of scripts/check.sh no other job runs, on the files the
    #     pull request changed: goimports, gopls check, and the go fix
    #     modernizers as a report. gofmt, tidy, vet and golangci-lint have jobs
    #     of their own.
    #
    # Each step after the first runs even when one before it failed, so one
    # run reports every failure.
    #
    # On main it checks the last commit. That also builds the pinned gopls and
    # goimports into the shared cache, which pull requests only restore.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          # The merge base with the target branch decides what changed.
          fetch-depth: 0

      # Go refuses a U+FEFF anywhere but the first bytes of a file ("illegal
      # byte order mark"). Some editors and agent tools turn a \uFEFF escape
      # into the literal character, so this names the file before the build
      # does. Write the escape "\xef\xbb\xbf" instead.
      - name: Find a literal U+FEFF after the first bytes
        run: |
          bad=$(git ls-files -z '*.go' | xargs -0 perl -0777 -ne 'print "$ARGV\n" if /.\xef\xbb\xbf/s')
          if [ -n "$bad" ]; then
            echo "These Go files hold a literal byte order mark. Write \\xef\\xbb\\xbf instead:" >&2
            echo "$bad" >&2
            exit 1
          fi

      # The go.mod toolchain line sets the stdlib that govulncheck scans, as
      # it did when govulncheck had a job of its own.
      - uses: ./.github/actions/setup-go
        if: ${{ !cancelled() }}
        with:
          go-version-file: go.mod
          cache-id: sanity

      - name: govulncheck
        if: ${{ !cancelled() }}
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...

      - name: Check the changed files
        if: ${{ !cancelled() }}
        env:
          BASE: ${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || 'HEAD~1' }}
        run: scripts/check.sh --changed "$BASE" --only fmt,fix,gopls

      - name: Report the modernizers
        if: always()
        run: |
          if [ -s .dev/check/fix.log ]; then
            {
              echo "### go fix modernizers on the changed packages"
              echo
              echo "These do not fail the check. Read each one before you apply it."
              echo
              echo '```'
              head -n 200 .dev/check/fix.log
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi

  cross-vet:
    name: go vet (darwin, windows, freebsd, openbsd)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # The release targets besides linux, which go-test.yml vets. A test file
    # that uses a unix-only syscall without a build tag breaks these and
    # nothing else. One job vets all four: each vet takes under half a minute,
    # and a job of its own spent as long again on setup and held a runner
    # that other pull requests wait for.
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup-go
        with:
          go-version-file: go.mod
          cache-id: vet-cross

      - name: Vet
        run: |
          status=0
          for goos in darwin windows freebsd openbsd; do
            echo "::group::go vet (GOOS=$goos)"
            if ! GOOS=$goos go vet ./... ./progstatus/... ./vt/... ./swatch/... ./shot/... ./tml/... ./plot/... ./loom/... ./sketch/...; then
              status=1
              echo "::error title=go vet failed::go vet failed for GOOS=$goos"
            fi
            echo "::endgroup::"
          done
          exit $status
