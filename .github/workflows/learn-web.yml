# Builds tuios for the browser, the files behind tuios.dev/learn, and
# uploads them as the learn-web artifact. It runs on pull requests too, so the
# js/wasm build cannot quietly stop compiling.
name: learn-web

# cmd/tuios-wasm imports internal/app, which pulls in almost every package
# under internal/ and pkg/ (go list -deps shows 33 of them under GOOS=js), so
# the filter is those trees as a whole. What it leaves out is what the js build
# never reads: cmd/tuios, cmd/tuios-web, e2e, docs and the rest of the repo.
# A pull request and a push to main call this workflow from ci.yml. Its
# changes job runs it when a package the js/wasm build or its Go tests build
# can be affected (GOOS=js).
on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

# No concurrency group here: ci.yml holds the one for pull requests, and a
# called workflow's github.workflow is the caller's name, so a group here
# would be shared with the caller's other jobs.

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          # build.sh names the version with git describe.
          fetch-depth: 0

      - uses: ./.github/actions/setup-go
        with:
          go-version-file: go.mod
          cache-id: wasm

      - name: Tools for compressing the wasm and the fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y brotli

      # The build is the long step. The Go tests and the browser download run
      # beside it, because neither needs its output. The browser download comes
      # after the tools step on purpose: both call apt-get, and two apt-get
      # processes at once fail on the dpkg lock.
      - parallel:
          - name: Tests of the browser build's Go side
            run: go test -count=1 ./internal/webshell/ ./internal/learn/...

          - name: Build
            run: cmd/tuios-wasm/build.sh learn-web

          - name: Headless Chromium for the smoke test
            run: |
              npm install --prefix "$RUNNER_TEMP/pw" playwright-core
              "$RUNNER_TEMP/pw/node_modules/.bin/playwright-core" install --with-deps chromium

      - name: Smoke test in headless Chromium
        run: |
          PLAYWRIGHT_CORE="$RUNNER_TEMP/pw/node_modules/playwright-core/index.mjs" \
            node cmd/tuios-wasm/smoke.mjs learn-web "$RUNNER_TEMP/smoke.png"

      # The basics track, every step by show me through the lesson engine,
      # with a frame per step.
      - name: Lesson smoke test in headless Chromium
        run: |
          PLAYWRIGHT_CORE="$RUNNER_TEMP/pw/node_modules/playwright-core/index.mjs" \
            node cmd/tuios-wasm/smoke-lessons.mjs learn-web "$RUNNER_TEMP/lesson-frames" basics

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: lesson-frames
          path: ${{ runner.temp }}/lesson-frames/
          if-no-files-found: ignore

      - uses: actions/upload-artifact@v7
        with:
          name: learn-web
          path: learn-web/
          if-no-files-found: error
