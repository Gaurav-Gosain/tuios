name: CI

# One workflow for the checks of a pull request and of main, except the
# end-to-end suite (e2e-tui.yml), which selects its own tests. The changes job
# reads the diff once and says which jobs the change can affect and which Go
# packages each test job tests (scripts/ci-changes.sh). Every other job calls
# a workflow of its own and runs only when the changes job says so. A job it
# skips reports as skipped, so the run still ends with a result.
#
# A pull request runs what its change can reach. The merge queue runs every
# job on the commit it is about to land. A push to main runs every job,
# except ghostty-vt, learn-web, clienttests, the image build, the Nix vendor
# hash and the Lean spec, which run on main only when the push touched their
# paths. A manual run runs everything.

on:
  push:
    branches: [main]
  pull_request:
    # labeled: the full-suite label runs every job on the head. Any other
    # label starts a run whose jobs all skip.
    types: [opened, synchronize, reopened, labeled]
  merge_group:
    types: [checks_requested]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # A pull request's group is its ref, so a newer push cancels the run in
  # progress. Every other run (main, a manual run) gets a group of its own and
  # is never cancelled or replaced while it waits. So does a run for a label
  # other than full-suite, so it cancels nothing.
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && !(github.event.action == 'labeled' && github.event.label.name != 'full-suite') && github.ref || github.run_id }}
  cancel-in-progress: true

jobs:
  changes:
    name: changes
    if: github.event.action != 'labeled' || github.event.label.name == 'full-suite'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      pkgs: ${{ steps.changes.outputs.pkgs }}
      ghostty_pkgs: ${{ steps.changes.outputs.ghostty_pkgs }}
      go: ${{ steps.changes.outputs.go }}
      vet: ${{ steps.changes.outputs.vet }}
      lint_libs: ${{ steps.changes.outputs.lint_libs }}
      unit: ${{ steps.changes.outputs.unit }}
      app_session: ${{ steps.changes.outputs.app_session }}
      windows: ${{ steps.changes.outputs.windows }}
      macos: ${{ steps.changes.outputs.macos }}
      sketch_fma: ${{ steps.changes.outputs.sketch_fma }}
      pins: ${{ steps.changes.outputs.pins }}
      lib_alone: ${{ steps.changes.outputs.lib_alone }}
      ghostty: ${{ steps.changes.outputs.ghostty }}
      learn_web: ${{ steps.changes.outputs.learn_web }}
      clienttests: ${{ steps.changes.outputs.clienttests }}
      docker: ${{ steps.changes.outputs.docker }}
      nix: ${{ steps.changes.outputs.nix }}
      binary_size: ${{ steps.changes.outputs.binary_size }}
      mixed_versions: ${{ steps.changes.outputs.mixed_versions }}
      spec: ${{ steps.changes.outputs.spec }}
    steps:
      - uses: actions/checkout@v7
        with:
          # A pull request checks out the merge of its head into the base, so
          # HEAD^1 is the base. A push compares with the commit before it,
          # which may be several commits back.
          fetch-depth: ${{ github.event_name == 'push' && 50 || 2 }}

      - uses: ./.github/actions/setup-go
        with:
          go-version-file: go.mod
          cache-id: changes

      - name: Choose the jobs and packages this change can affect
        id: changes
        env:
          CHANGES_BEFORE: ${{ github.event.before }}
          # The full-suite label runs every job.
          CHANGES_FULL: ${{ contains(github.event.pull_request.labels.*.name, 'full-suite') }}
        run: |
          scripts/ci-changes.sh | tee "$RUNNER_TEMP/changes.txt"
          # scripts/full-suite-passed.sh reads this notice.
          if grep -qx 'pkgs=all' "$RUNNER_TEMP/changes.txt" && grep -qx 'unit=true' "$RUNNER_TEMP/changes.txt"; then
            echo "::notice title=CI selection::all"
          fi
          {
            echo "### What this change runs"
            echo
            echo '```'
            sed 's/^\(pkgs\|ghostty_pkgs\)=\(.\{300\}\).*/\1=\2 .../' "$RUNNER_TEMP/changes.txt"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  go-test:
    name: go-test
    needs: changes
    if: needs.changes.outputs.unit == 'true' || needs.changes.outputs.app_session == 'true' || needs.changes.outputs.windows == 'true' || needs.changes.outputs.macos == 'true' || needs.changes.outputs.sketch_fma == 'true'
    uses: ./.github/workflows/go-test.yml
    with:
      pkgs: ${{ needs.changes.outputs.pkgs }}
      unit: ${{ needs.changes.outputs.unit }}
      app_session: ${{ needs.changes.outputs.app_session }}
      windows: ${{ needs.changes.outputs.windows }}
      macos: ${{ needs.changes.outputs.macos }}
      sketch_fma: ${{ needs.changes.outputs.sketch_fma }}

  lint:
    name: lint
    needs: changes
    if: needs.changes.outputs.go == 'true'
    uses: ./.github/workflows/lint.yml
    with:
      vet: ${{ needs.changes.outputs.vet }}
      lint_libs: ${{ needs.changes.outputs.lint_libs }}

  libraries:
    name: libraries
    needs: changes
    if: needs.changes.outputs.pins == 'true' || needs.changes.outputs.lib_alone != '[]'
    uses: ./.github/workflows/libraries.yml
    with:
      pins: ${{ needs.changes.outputs.pins }}
      lib_alone: ${{ needs.changes.outputs.lib_alone }}

  binary-size:
    name: binary-size
    needs: changes
    if: needs.changes.outputs.binary_size == 'true'
    permissions:
      contents: read
      # Read main's size artifacts.
      actions: read
      # Post or update the one size comment on the pull request.
      pull-requests: write
    uses: ./.github/workflows/binary-size.yml

  ghostty-vt:
    name: ghostty-vt
    needs: changes
    if: needs.changes.outputs.ghostty == 'true'
    uses: ./.github/workflows/ghostty-vt.yml
    with:
      pkgs: ${{ needs.changes.outputs.ghostty_pkgs }}

  learn-web:
    name: learn-web
    needs: changes
    if: needs.changes.outputs.learn_web == 'true'
    uses: ./.github/workflows/learn-web.yml

  clienttests:
    name: clienttests
    needs: changes
    if: needs.changes.outputs.clienttests == 'true'
    uses: ./.github/workflows/clienttests.yml

  docker-build:
    name: docker-build
    needs: changes
    if: needs.changes.outputs.docker == 'true'
    uses: ./.github/workflows/docker-build.yml

  mixed-versions:
    name: mixed-versions
    needs: changes
    if: needs.changes.outputs.mixed_versions == 'true'
    uses: ./.github/workflows/mixed-versions.yml

  nix-vendor-hash:
    name: nix-vendor-hash
    needs: changes
    if: needs.changes.outputs.nix == 'true'
    uses: ./.github/workflows/nix-vendor-hash.yml

  spec:
    name: spec
    needs: changes
    if: needs.changes.outputs.spec == 'true'
    uses: ./.github/workflows/spec.yml

  # The one check of this workflow that the main ruleset and the merge queue
  # require. A job the change did not need is skipped and counts as passed. A
  # job that failed, or was cancelled, fails this one. Requiring each job by
  # name does not work: a pull request skips most of them, and a skipped call
  # of a reusable workflow reports no job of that name.
  ci-result:
    name: CI result
    if: ${{ !cancelled() && (github.event.action != 'labeled' || github.event.label.name == 'full-suite') }}
    needs: [changes, go-test, lint, libraries, binary-size, ghostty-vt, learn-web, clienttests, docker-build, mixed-versions, nix-vendor-hash, spec]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Every job passed or was not needed
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          set -euo pipefail
          bad=$(jq -r 'to_entries[] | select(.value.result != "success" and .value.result != "skipped") | "\(.key): \(.value.result)"' <<<"$RESULTS")
          if [ -n "$bad" ]; then
            echo "These jobs did not pass:"
            echo "$bad"
            exit 1
          fi
          echo "Every job passed or was not needed."
