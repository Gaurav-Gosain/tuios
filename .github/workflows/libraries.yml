name: Go libraries

# The Go libraries in this repository, each a module of its own under a
# tuios.dev import path (progstatus/, vt/, swatch/, shot/, tml/, plot/, loom/ and sketch/). CI and local builds use the
# folders through go.work. `go install .../cmd/tuios@vX` and the release use
# the versions go.mod pins. This workflow keeps the two in step, and tests each
# library alone, as an importer gets it.

# A pull request and a push to main call this workflow from ci.yml, which
# passes whether the pins changed and which "alone" jobs to run.
on:
  workflow_call:
    inputs:
      pins:
        type: string
        default: "true"
      lib_alone:
        description: A JSON list of the alone jobs to run, of "vt", "sketch" and "small".
        type: string
        default: '["vt","sketch","small"]'
  workflow_dispatch:

permissions:
  contents: read

# No concurrency group here: ci.yml holds the one for pull requests, and a
# called workflow's github.workflow is the caller's name, so a group here
# would be shared with the caller's other jobs.

jobs:
  pins:
    name: library pins
    if: inputs.pins != 'false'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          # A pin names a commit or a library tag, so the check needs history.
          fetch-depth: 0

      - uses: ./.github/actions/setup-go
        with:
          go-version-file: go.mod
          cache-id: pins

      # Each pinned version holds the same files as its folder, go.work
      # replaces it with that folder, tuios builds without go.work, and go.work
      # changes no dependency of tuios. The libraries come from their pinned
      # commits here. The release runs the same check through tuios.dev.
      - name: Check the library pins
        run: scripts/library-pins.sh check

  module:
    name: ${{ matrix.id == 'small' && 'progstatus, swatch, shot, tml, plot and loom' || matrix.id }} alone
    if: inputs.lib_alone != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # vt and sketch take a minute or more each and get a job of their own.
        # The small libraries share one, since each tests in seconds and a job
        # of its own spent longer on setup than on the library. ci.yml passes
        # only the jobs whose library changed.
        id: ${{ fromJSON(inputs.lib_alone || '["vt","sketch","small"]') }}
    env:
      # The module as an importer builds it: no workspace, and the oldest Go
      # its go.mod allows.
      GOWORK: "off"
      GOTOOLCHAIN: local
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup-go
        with:
          # All six small libraries ask for go 1.25, and swatch/go.mod names
          # 1.25.0, the oldest Go any of them allows.
          go-version-file: ${{ matrix.id == 'small' && 'swatch/go.mod' || format('{0}/go.mod', matrix.id) }}
          cache-id: lib-${{ matrix.id }}

      - name: Tidy, vet and test
        env:
          DIRS: ${{ matrix.id == 'small' && 'progstatus swatch shot tml plot loom' || matrix.id }}
        run: |
          status=0
          for dir in $DIRS; do
            echo "::group::$dir"
            if ! (cd "$dir" && go mod tidy -diff && go vet ./... && go test -count=1 ./...); then
              status=1
              echo "::error title=$dir failed::tidy, vet or test failed in $dir"
            fi
            echo "::endgroup::"
          done
          exit $status
