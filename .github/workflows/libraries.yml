name: Go libraries

# The Go libraries in this repository, each a module of its own under a
# tuios.dev import path (progstatus/, vt/, swatch/, shot/, tml/, plot/, loom/ and sketch/). CI and local builds use the
# folders through go.work. `go install .../cmd/tuios@vX` and the release use
# the versions go.mod pins. This workflow keeps the two in step, and tests each
# library alone, as an importer gets it.

on:
  push:
    branches: [main]
  pull_request:
    paths-ignore:
      # Files that no Go build, Go test or e2e test reads. A pull request
      # that changes only these starts none of this workflow's jobs. Main
      # still runs everything.
      - "*.md"
      - "e2e/tui/*.md"
      - "assets/**"
      - ".github/ISSUE_TEMPLATE/**"
      - ".github/PULL_REQUEST_TEMPLATE/**"
      - ".github/contributors-exclude"
      - "LICENSE"
      - "CITATION.cff"
      # docs/ too: the unit tests of cmd/tuios and internal/session read
      # docs/CLI_REFERENCE.md and others, so go-test.yml keeps running for it.
      - "docs/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # A pull request's group is its ref, so a newer push cancels the run in
  # progress. Every other run (main, the nightly, a manual run) gets a group of
  # its own and is never cancelled or replaced while it waits.
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: true

jobs:
  pins:
    name: library pins
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          # A pin names a commit or a library tag, so the check needs history.
          fetch-depth: 0

      - uses: ./.github/actions/setup-go
        with:
          go-version-file: go.mod
          cache-id: pins

      # Each pinned version holds the same files as its folder, go.work
      # replaces it with that folder, tuios builds without go.work, and go.work
      # changes no dependency of tuios. The libraries come from their pinned
      # commits here. The release runs the same check through tuios.dev.
      - name: Check the library pins
        run: scripts/library-pins.sh check

  module:
    name: ${{ matrix.name }} alone
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        # vt and sketch take a minute or more each and get a job of their own.
        # The small libraries share one, since each tests in seconds and a job
        # of its own spent longer on setup than on the library.
        include:
          - name: vt
            id: vt
            dirs: vt
            gomod: vt/go.mod
          - name: sketch
            id: sketch
            dirs: sketch
            gomod: sketch/go.mod
          - name: progstatus, swatch, shot, tml, plot and loom
            id: small
            dirs: progstatus swatch shot tml plot loom
            # All six ask for go 1.25, and swatch/go.mod names 1.25.0, the
            # oldest Go any of them allows.
            gomod: swatch/go.mod
    env:
      # The module as an importer builds it: no workspace, and the oldest Go
      # its go.mod allows.
      GOWORK: "off"
      GOTOOLCHAIN: local
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup-go
        with:
          go-version-file: ${{ matrix.gomod }}
          cache-id: lib-${{ matrix.id }}

      - name: Tidy, vet and test
        env:
          DIRS: ${{ matrix.dirs }}
        run: |
          status=0
          for dir in $DIRS; do
            echo "::group::$dir"
            if ! (cd "$dir" && go mod tidy -diff && go vet ./... && go test -count=1 ./...); then
              status=1
              echo "::error title=$dir failed::tidy, vet or test failed in $dir"
            fi
            echo "::endgroup::"
          done
          exit $status
