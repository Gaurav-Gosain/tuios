name: Go unit tests

# The root module's suite, which no workflow ran until this one. The end-to-end
# job covers e2e/tui and the ghostty job covers a -short subset of three
# packages, so "the full gate is green" in a pull request was a claim by the
# person who typed it. This is the machine that checks it.

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # 03:17 UTC daily, for the race build below.
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

# A push to main once cancelled the nightly race build, when the group was the
# ref alone. Runs outside pull requests now get a group of their own.
concurrency:
  # A pull request's group is its ref, so a newer push cancels the run in
  # progress. Every other run (main, the nightly, a manual run) gets a group of
  # its own and is never cancelled or replaced while it waits.
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: true

jobs:
  unit:
    name: go test ./...
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    # Measured on a developer machine: internal/testutil 252 s, internal/app
    # 231 s, everything else under 35 s, about ten minutes if nothing runs in
    # parallel. A runner has fewer cores, so thirty is the room a slow one
    # needs. It is above the 20 m the test command carries on purpose: the test
    # timeout has to fire first, because it prints the goroutine dump and the
    # job timeout only prints that the job was killed.
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v7
        with:
          # The tidy check builds each Go library of this repository from the
          # commit go.mod pins (scripts/library-pins.sh), so it needs history.
          fetch-depth: 0

      - uses: ./.github/actions/setup-go
        with:
          go-version-file: go.mod
          cache-id: unit

      - name: Formatting
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "gofmt would change these files:"
            echo "$unformatted"
            exit 1
          fi

      - name: Modules are tidy
        # Both modules, because e2e/tui replaces the root one and so carries the
        # root's dependencies as indirect requirements of its own. A dependency
        # bump in the root leaves those stale, and nothing here noticed: the
        # end-to-end job failed instead, in all four shards at once, with "go:
        # updates to go.mod needed" from a module the change had not touched by
        # name. That has happened twice. This says which module and says it in
        # the job the change belongs to.
        #
        # go mod tidy ignores go.work, so it needs each Go library of this
        # repository (progstatus/, vt/, swatch/, shot/, tml/, plot/, loom/) at the version go.mod pins.
        # The libraries come from a GOPROXY directory built from the pinned
        # commits, so the check does not depend on tuios.dev.
        run: |
          scripts/library-pins.sh proxy "$RUNNER_TEMP/libproxy"
          export GOPROXY="file://$RUNNER_TEMP/libproxy,$(go env GOPROXY)" GONOSUMDB=tuios.dev
          for dir in . e2e/tui progstatus vt swatch shot tml plot loom sketch; do
            if ! (cd "$dir" && GOWORK=off go mod tidy -diff); then
              echo "$dir/go.mod is not tidy; run: (cd $dir && go mod tidy)" >&2
              exit 1
            fi
          done

      # ./... stops at a nested module, so the libraries are named too.
      - name: Vet
        run: go vet ./... ./progstatus/... ./vt/... ./swatch/... ./shot/... ./tml/... ./plot/... ./loom/... ./sketch/...

      - name: Build
        run: go build ./... ./progstatus/... ./vt/... ./swatch/... ./shot/... ./tml/... ./plot/... ./loom/... ./sketch/...

      - name: Example tapes validate
        # Every example under examples/ is held to the parser the release
        # ships. A tape the parser grew stricter about fails here, in the
        # change that made it stricter, instead of on a reader's machine.
        run: |
          go build -o "$RUNNER_TEMP/tuios" ./cmd/tuios
          status=0
          for f in examples/*.tape; do
            "$RUNNER_TEMP/tuios" tape validate "$f" > /dev/null || status=1
          done
          exit $status

      - name: Allow user namespaces
        # TestOwnerForgetsAnEmptiedGroup (internal/herdrplugin) reuses a pid on
        # purpose, which needs a pid namespace of its own. Ubuntu 24.04 lets
        # AppArmor refuse unprivileged user namespaces, and the test fails
        # under CI rather than skip.
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      - name: Test
        # No -race here. internal/app takes over ten minutes under the detector
        # on a developer machine and longer on a runner, and a job that times
        # out is a job somebody switches off. The race build runs nightly
        # instead, where the wall time costs nobody a review.
        #
        # -count=1 because the test cache replays a pass across a change the
        # cache key does not see, which is how a mutation sweep can come back
        # green on code that no longer exists.
        #
        # A failure of tests listed in .github/flaky-tests.txt, and only of
        # those, gets one retry of those tests. Anything else fails the job.
        run: |
          set -o pipefail
          pkgs="./... ./progstatus/... ./vt/... ./swatch/... ./shot/... ./tml/... ./plot/... ./loom/... ./sketch/..."
          # $pkgs is split on purpose: one argument per pattern.
          # shellcheck disable=SC2086
          go test $pkgs -count=1 -timeout 20m 2>&1 | tee "$RUNNER_TEMP/unit.log" ||
            scripts/retry-flaky.sh "$RUNNER_TEMP/unit.log" $pkgs

  windows:
    name: go test (windows)
    if: github.event_name != 'schedule'
    runs-on: windows-latest
    # The packages whose Windows code runs only on Windows: the herdr link
    # (hardlink, copy and a running link), the PATHEXT lookup and the job
    # object for plugin processes, the stop event kill-server sets, the
    # herdr command line the link runs, the opencode socket owner check, the
    # owner and DACL checks of service.json and of the tuios-web password
    # file, the job object of the opencode export, and the web daemon E2E
    # tests.
    # The whole suite has never run on Windows and does not run here.
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup-go
        with:
          go-version-file: go.mod
          cache-id: tests

      - name: Test
        run: go test -count=1 -timeout 10m ./internal/shimlink/ ./internal/herdrplugin/ ./internal/stopevent/ ./internal/herdrcli/ ./cmd/tuios-web/

      - name: Test the opencode and password file checks
        # The rest of internal/transcriptview runs shell scripts, so only the
        # opencode checks and the table parsers run here: the socket owner,
        # the owner and DACL of service.json, and the job that kills the
        # export's processes. The owner and DACL checks of service.json and
        # of the tuios-web password file share internal/winacl.
        #
        # go test passes when -run matches nothing, and a test that skips
        # passes too. Each test named below must print its PASS line, so a
        # rename or a skip fails the step.
        shell: bash
        run: |
          go test -count=1 -timeout 5m -v \
            -run "TestOpenCodeConnOwner|TestOpenCodeServiceDACL|TestOpenCodeExportTree|TestTCPTableOwner|TestPcblistOwner|TestProcNetOwner|TestPasswordFileDACL|TestPasswordFileChecks|TestGrantsOther" \
            ./internal/transcriptview/ ./cmd/tuios-web/ ./internal/winacl/ | tee "$RUNNER_TEMP/owner-tests.log"
          for name in TestOpenCodeConnOwner TestOpenCodeServiceDACL TestOpenCodeExportTree TestTCPTableOwner \
            TestPasswordFileDACL TestGrantsOther; do
            if ! grep -q -- "^--- PASS: $name " "$RUNNER_TEMP/owner-tests.log"; then
              echo "::error::$name did not run and pass"
              exit 1
            fi
          done

  macos:
    name: go test (macos)
    if: github.event_name != 'schedule'
    runs-on: macos-latest
    # The opencode reader proves that a socket belongs to this user from the
    # sysctl net.inet.tcp.pcblist_n, which only a real macOS kernel fills.
    # The package's suite runs here, the real table included. The plugin
    # runner holds a native plugin to its grants through the darwin reaper
    # code, so its suite and the session's plugin grant tests run here too.
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup-go
        with:
          go-version-file: go.mod
          cache-id: tests

      - name: Test
        run: go test -count=1 -timeout 10m ./internal/transcriptview/ ./internal/herdrplugin/

      - name: Plugin grant tests
        # go test passes when -run matches nothing, and a test that skips
        # passes too. Each test named below must print its PASS line, so a
        # rename or a skip fails the step.
        shell: bash
        run: |
          go test -count=1 -timeout 5m -v \
            -run '^(TestHerdrMethodsNameTheirCheck|TestHerdrVerbMethodsRefuseAPluginWithNoGrants)$' \
            ./internal/session/ | tee "$RUNNER_TEMP/plugin-grant-tests.log"
          for name in TestHerdrMethodsNameTheirCheck TestHerdrVerbMethodsRefuseAPluginWithNoGrants; do
            if ! grep -q -- "^--- PASS: $name " "$RUNNER_TEMP/plugin-grant-tests.log"; then
              echo "::error::$name did not run and pass"
              exit 1
            fi
          done

  sketch-fma:
    name: sketch goldens (${{ matrix.name }})
    if: github.event_name != 'schedule'
    # tuios.dev/sketch promises pele's SVG byte for byte. The Go spec lets the
    # compiler fuse x*y+z into one FMA, which rounds once where JavaScript
    # rounds twice. arm64 fuses, and so does amd64 at GOAMD64=v3. The unit job
    # runs on amd64 at v1, which never fuses, so these two run the goldens
    # where the compiler does. If one fails, wrap the product in float64(),
    # which the spec says rounds it on its own.
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux/arm64
            runner: ubuntu-24.04-arm
            goamd64: ""
          - name: linux/amd64 v3
            runner: ubuntu-latest
            goamd64: v3
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup-go
        with:
          go-version-file: go.mod
          cache-id: sketch${{ matrix.goamd64 }}

      - name: Test sketch
        env:
          GOAMD64: ${{ matrix.goamd64 }}
        run: go test -count=1 -timeout 10m ./sketch/...

  race:
    name: go test -race ./...
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    # The detector costs about ten times the wall time on internal/app. This is
    # a backstop, not a budget to fill.
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup-go
        with:
          go-version-file: go.mod
          cache-id: race

      - name: Allow user namespaces
        # TestOwnerForgetsAnEmptiedGroup (internal/herdrplugin) reuses a pid on
        # purpose, which needs a pid namespace of its own. Ubuntu 24.04 lets
        # AppArmor refuse unprivileged user namespaces, and the test fails
        # under CI rather than skip.
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      - name: Test with the race detector
        run: go test ./... ./progstatus/... ./vt/... ./swatch/... ./shot/... ./tml/... ./plot/... ./loom/... ./sketch/... -race -count=1 -timeout 80m
