# Keeps the README's contributors mosaic current. The job redraws
# assets/contributors.svg with scripts/contributors.sh and, when it changes,
# opens or updates a pull request from the chore/contributors branch. It never
# pushes to main.
name: contributors

on:
  schedule:
    # Mondays, off the hour.
    - cron: "41 6 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      BRANCH: chore/contributors
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/setup-go
        with:
          go-version-file: go.mod
          cache-id: contributors

      - name: Redraw the mosaic
        run: ./scripts/contributors.sh "${GITHUB_REPOSITORY}"

      - name: Open or update the pull request
        run: |
          if git diff --quiet -- assets/contributors.svg; then
            echo "contributors unchanged"
            exit 0
          fi
          ./scripts/contributors-pr.sh "$BRANCH"
