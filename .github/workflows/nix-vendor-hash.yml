name: Nix vendor hash

# tuios.nix pins a hash of the Go module dependencies. update-nix.yml only
# refreshes it when a release is tagged, so a change to go.mod or go.sum on main
# left `nix run github:Gaurav-Gosain/tuios` failing with a hash mismatch until
# the next release (#220). This check fails the pull request that changes the
# dependencies and prints the hash to put in tuios.nix.
on:
  pull_request:
    paths:
      - go.mod
      - go.sum
      - go.work
      - go.work.sum
      - progstatus/go.mod
      - vt/go.mod
      - vt/go.sum
      - swatch/go.mod
      - swatch/go.sum
      - shot/go.mod
      - shot/go.sum
      - tml/go.mod
      - plot/go.mod
      - plot/go.sum
      - loom/go.mod
      - loom/go.sum
      - sketch/go.mod
      - sketch/go.sum
      - tuios.nix
      - flake.nix
      - flake.lock
  push:
    branches: [main]
    paths:
      - go.mod
      - go.sum
      - go.work
      - go.work.sum
      - progstatus/go.mod
      - vt/go.mod
      - vt/go.sum
      - swatch/go.mod
      - swatch/go.sum
      - shot/go.mod
      - shot/go.sum
      - tml/go.mod
      - plot/go.mod
      - plot/go.sum
      - loom/go.mod
      - loom/go.sum
      - sketch/go.mod
      - sketch/go.sum
      - tuios.nix
      - flake.nix
      - flake.lock
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # A pull request's group is its ref, so a newer push cancels the run in
  # progress. Every other run (main, the nightly, a manual run) gets a group of
  # its own and is never cancelled or replaced while it waits.
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: true

jobs:
  vendor-hash:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install Nix
        uses: cachix/install-nix-action@448cde739abec1eaf0646249e3d25bb8d9bc7702 # v31.11.2
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      # Building with a fake hash makes Nix print the real one. The build of the
      # module derivation fails either way, so its output is read, not its exit
      # status.
      - name: Compare the vendor hash
        run: |
          set -u
          pinned=$(sed -n 's/.*vendorHash = "\(sha256-[^"]*\)";.*/\1/p' tuios.nix)
          if [ -z "$pinned" ]; then
            echo "::error file=tuios.nix::No vendorHash = \"sha256-...\" line found."
            exit 1
          fi
          sed -i 's/vendorHash = "sha256-[^"]*";/vendorHash = pkgs.lib.fakeHash;/' tuios.nix
          actual=$(nix build .#tuios --no-link 2>&1 | sed -n 's/.*got: *\(sha256-[^ ]*\).*/\1/p' | head -1)
          git checkout -- tuios.nix
          if [ -z "$actual" ]; then
            echo "::error::Nix did not report a hash. Run 'nix build .#tuios' to see why."
            exit 1
          fi
          if [ "$pinned" != "$actual" ]; then
            echo "::error file=tuios.nix::The Go dependencies changed. Set vendorHash to \"$actual\" (it is \"$pinned\")."
            exit 1
          fi
          echo "vendorHash is current: $pinned"
