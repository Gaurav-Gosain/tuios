name: Update Nix Package

on:
  push:
    tags:
      - 'v*.*.*'
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g., v0.0.24)'
        required: true
        type: string

# It pushes the updated tuios.nix straight to main and opens no pull request,
# so it needs contents: write and nothing more.
permissions:
  contents: write

# A tag push and the release it publishes both start this workflow. Running
# them one after the other, rather than side by side, keeps them from racing
# each other to push to main; the second then finds nothing to commit.
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  update-nix:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: main

      - name: Install Nix
        uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      # The tag reaches the shell through the environment rather than being
      # pasted into the script, so a dispatched tag cannot inject a command.
      - name: Extract version from tag
        id: version
        env:
          EVENT: ${{ github.event_name }}
          INPUT_TAG: ${{ inputs.tag }}
          REF_NAME: ${{ github.ref_name }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          # Get the tag from push event, release event, or manual input
          if [ "$EVENT" = "workflow_dispatch" ]; then
            VERSION="$INPUT_TAG"
          elif [ "$EVENT" = "push" ]; then
            VERSION="$REF_NAME"
          else
            VERSION="$RELEASE_TAG"
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Update tuios.nix version
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          # Update version in tuios.nix
          sed -i "s/version = \"v[0-9]*\.[0-9]*\.[0-9]*\";/version = \"${VERSION}\";/" tuios.nix

          echo "Updated version to ${VERSION}"

      - name: Calculate vendor hash
        id: hash
        run: |
          # Try to build with fake hash to get the real hash
          # This will fail but give us the correct hash in the error

          # First try with lib.fakeHash to get the error
          sed -i 's/vendorHash = "sha256-[^"]*";/vendorHash = pkgs.lib.fakeHash;/' tuios.nix

          # Build and capture output (will fail with hash mismatch)
          set +e
          BUILD_OUTPUT=$(nix build .#tuios 2>&1)
          set -e

          # Extract the hash from the error message
          # Look for pattern like "got: sha256-XXXXX"
          HASH=$(echo "$BUILD_OUTPUT" | grep -oP "got:\s+\Ksha256-[A-Za-z0-9+/=]+" | head -1)

          if [ -z "$HASH" ]; then
            echo "Failed to extract hash from build output"
            echo "$BUILD_OUTPUT"
            exit 1
          fi

          echo "Extracted hash: $HASH"
          echo "hash=$HASH" >> "$GITHUB_OUTPUT"

      - name: Update tuios.nix hash
        env:
          HASH: ${{ steps.hash.outputs.hash }}
        run: |
          # Update the vendor hash (use | as delimiter to avoid issues with / in hash)
          sed -i "s|vendorHash = pkgs.lib.fakeHash;|vendorHash = \"${HASH}\";|" tuios.nix

          echo "Updated vendorHash to ${HASH}"

      - name: Verify build works
        run: |
          echo "Verifying the build works with new hash..."
          nix build .#tuios
          echo "Build successful!"

      - name: Commit and push changes
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"

          # The second of the two runs a release starts finds main already
          # updated, and an empty commit would fail the job.
          if git diff --quiet -- tuios.nix; then
            echo "tuios.nix is already at ${VERSION}"
            exit 0
          fi

          git add tuios.nix
          git commit -m "chore: update nix package to ${VERSION}"

          # Push using the GitHub token
          git push "https://x-access-token:${GITHUB_TOKEN}@github.com/Gaurav-Gosain/tuios.git" HEAD:main
