# The ghostty build tag swaps the terminal emulator for libghostty-vt. This
# job keeps that build compiling and its differential harness honest: the
# same bytes must produce the same state on both emulators. It also runs the
# tests of every package built on the emulator, because scripts/install.sh
# ships this backend by default and the go-test workflow only covers the
# pure one. The renderer tests in internal/app failed here for weeks while
# this job ran only the emulator's own packages.
#
# The paths below are every package that imports vt, directly or
# through another one. A change to one of them can break it on this backend,
# and the job body already tests them all; the trigger has to see them too.
name: ghostty-vt

on:
  push:
    branches: [main]
    paths:
      - "vt/**"
      - "internal/session/**"
      - "internal/terminal/**"
      - "internal/app/**"
      - "internal/input/**"
      - "internal/scrollback/**"
      - "internal/tmuxcompat/**"
      - "internal/served/**"
      - "internal/server/**"
      - "internal/ui/**"
      - "internal/learn/**"
      - "internal/cellsize/**"
      - "internal/ptyspawn/**"
      - "internal/fuzz/**"
      - "internal/guibridge/**"
      - "pkg/tuios/**"
      - "cmd/tuios/**"
      - "cmd/tuios-web/**"
      - "cmd/tuios-fuzz/**"
      - "scripts/ghostty-lib.sh"
      - ".github/workflows/ghostty-vt.yml"
      - ".github/actions/setup-go/**"
      - "go.mod"
      - "go.sum"
      - "go.work"
      - "go.work.sum"
      - "progstatus/**"
      - "swatch/**"
      - "shot/**"
      - "tml/**"
      - "plot/**"
      - "loom/**"
      - "sketch/**"
  pull_request:
    paths:
      - "vt/**"
      - "internal/session/**"
      - "internal/terminal/**"
      - "internal/app/**"
      - "internal/input/**"
      - "internal/scrollback/**"
      - "internal/tmuxcompat/**"
      - "internal/served/**"
      - "internal/server/**"
      - "internal/ui/**"
      - "internal/learn/**"
      - "internal/cellsize/**"
      - "internal/ptyspawn/**"
      - "internal/fuzz/**"
      - "internal/guibridge/**"
      - "pkg/tuios/**"
      - "cmd/tuios/**"
      - "cmd/tuios-web/**"
      - "cmd/tuios-fuzz/**"
      - "scripts/ghostty-lib.sh"
      - ".github/workflows/ghostty-vt.yml"
      - ".github/actions/setup-go/**"
      - "go.mod"
      - "go.sum"
      - "go.work"
      - "go.work.sum"
      - "progstatus/**"
      - "swatch/**"
      - "shot/**"
      - "tml/**"
      - "plot/**"
      - "loom/**"
      - "sketch/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # A pull request's group is its ref, so a newer push cancels the run in
  # progress. Every other run (main, the nightly, a manual run) gets a group of
  # its own and is never cancelled or replaced while it waits.
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: true

jobs:
  differential:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      # The three setup steps download and unpack, and none reads what another
      # writes, so they run at the same time.
      - parallel:
          - uses: ./.github/actions/setup-go
            with:
              go-version-file: go.mod
              cache-id: ghostty

          # setup-zig has no release on the Node 24 runtime yet, so the runner
          # warns that it forces it onto Node 24. It works there.
          - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
            with:
              version: 0.16.0

          - name: Cache libghostty-vt
            uses: actions/cache@v6
            with:
              path: .ghostty-vt
              key: ghostty-vt-${{ hashFiles('scripts/ghostty-lib.sh') }}-native

      - name: Build libghostty-vt
        run: ./scripts/ghostty-lib.sh

      # The two builds run in the slack of the test step, which spends most of
      # its time in a few long packages. A failure in any of the three fails
      # the job at the end of the group.
      - parallel:
          - name: Tagged build compiles everywhere
            run: PKG_CONFIG_PATH="$PWD/.ghostty-vt/native/pkgconfig" go build -tags ghostty ./... ./vt/...

          # Every package whose tests link the emulator, found from the import
          # graph so a new one is covered without editing this list: the
          # differential and wire fidelity tests in vt and
          # internal/session, and the renderer, input and CLI tests above them.
          - name: Tests on the ghostty backend
            run: |
              pkgs=$(go list -tags ghostty -test -f '{{.ForTest}} {{join .Deps " "}}' ./... ./vt/... |
                awk '$1 ~ /^(github.com\/Gaurav-Gosain\/tuios\/|tuios.dev\/vt)/ &&
                     / tuios.dev\/vt( |$)/ {print $1}' |
                sort -u)
              echo "$pkgs"
              # $pkgs is split on purpose: one argument per package.
              # shellcheck disable=SC2086
              PKG_CONFIG_PATH="$PWD/.ghostty-vt/native/pkgconfig" \
                go test -tags ghostty -count=1 -short $pkgs

          - name: Pure build unaffected
            run: CGO_ENABLED=0 go build ./... ./vt/...
