# The ghostty build tag swaps the terminal emulator for libghostty-vt. This
# job keeps that build compiling and its differential harness honest: the
# same bytes must produce the same state on both emulators. It also runs the
# tests of every package built on the emulator, because scripts/install.sh
# ships this backend by default and the go-test workflow only covers the
# pure one. The renderer tests in internal/app failed here for weeks while
# this job ran only the emulator's own packages.
name: ghostty-vt

# A pull request and a push to main call this workflow from ci.yml. Its
# changes job runs it when a package that links vt can be affected, with
# the build tag on, and passes the packages to test.
on:
  workflow_call:
    inputs:
      pkgs:
        description: The import paths to test, space separated, or "all".
        type: string
        default: all
  workflow_dispatch:

permissions:
  contents: read

# No concurrency group here: ci.yml holds the one for pull requests, and a
# called workflow's github.workflow is the caller's name, so a group here
# would be shared with the caller's other jobs.

jobs:
  differential:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      # The three setup steps download and unpack, and none reads what another
      # writes, so they run at the same time.
      - parallel:
          - uses: ./.github/actions/setup-go
            with:
              go-version-file: go.mod
              cache-id: ghostty

          # setup-zig has no release on the Node 24 runtime yet, so the runner
          # warns that it forces it onto Node 24. It works there.
          - uses: mlugg/setup-zig@d1434d08867e3ee9daa34448df10607b98908d29 # v2.2.1
            with:
              version: 0.16.0

          - name: Cache libghostty-vt
            uses: actions/cache@v6
            with:
              path: .ghostty-vt
              key: ghostty-vt-${{ hashFiles('scripts/ghostty-lib.sh') }}-native

      - name: Build libghostty-vt
        run: ./scripts/ghostty-lib.sh

      # The two builds run in the slack of the test step, which spends most of
      # its time in a few long packages. A failure in any of the three fails
      # the job at the end of the group.
      - parallel:
          - name: Tagged build compiles everywhere
            run: PKG_CONFIG_PATH="$PWD/.ghostty-vt/native/pkgconfig" go build -tags ghostty ./... ./vt/...

          # Every package whose tests link the emulator, found from the import
          # graph so a new one is covered without editing this list: the
          # differential and wire fidelity tests in vt and
          # internal/session, and the renderer, input and CLI tests above them.
          - name: Tests on the ghostty backend
            env:
              PKGS: ${{ inputs.pkgs }}
            run: |
              pkgs=$(go list -tags ghostty -test -f '{{.ForTest}} {{join .Deps " "}}' ./... ./vt/... |
                awk '$1 ~ /^(github.com\/Gaurav-Gosain\/tuios\/|tuios.dev\/vt)/ &&
                     / tuios.dev\/vt( |$)/ {print $1}' |
                sort -u)
              # A pull request tests only the ones its change can affect, as
              # the changes job of ci.yml chose them.
              case ${PKGS:-all} in
              all) ;;
              *) pkgs=$(comm -12 <(echo "$pkgs") <(tr ' ' '\n' <<<"$PKGS" | grep . | sort -u)) ;;
              esac
              echo "$pkgs"
              if [ -z "$pkgs" ]; then
                echo "The change affects no package that links the emulator."
                exit 0
              fi
              # internal/session and internal/app take over three minutes each
              # one test after another. scripts/go-test-lanes.sh splits their
              # tests across four go test processes that run side by side.
              # $pkgs is split on purpose: one argument per package.
              # shellcheck disable=SC2086
              PKG_CONFIG_PATH="$PWD/.ghostty-vt/native/pkgconfig" GOFLAGS=-tags=ghostty \
                SPLIT="./internal/app ./internal/session" LOG="$RUNNER_TEMP/ghostty.log" \
                scripts/go-test-lanes.sh -count=1 -short -- $pkgs

          - name: Pure build unaffected
            run: CGO_ENABLED=0 go build ./... ./vt/...
