# Checks the Lean models in spec/: the task card lifecycle (spec/tasks) and
# the pane grants and verb scopes (spec/grants). The job builds each model,
# which checks its proofs, and runs its differential test. The task test runs
# random move streams through the model and through
# internal/session/task_move.go. The grants test runs random states and calls
# through the model and through the checks in internal/session that decide
# which pane may call which verb. Each fails on the first difference.
name: spec

# ci.yml calls this workflow for a change to spec/ or to the Go code the model
# describes (scripts/ci-changes.sh). The nightly run on main tries new random
# streams, since each run picks its seed from the clock.
on:
  workflow_call:
  schedule:
    # 02:11 UTC daily, clear of the race build at 03:17.
    - cron: "11 2 * * *"
  workflow_dispatch:

permissions:
  contents: read

# No concurrency group here: ci.yml holds the one for pull requests, and a
# called workflow's github.workflow is the caller's name.

jobs:
  spec:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup-go
        with:
          go-version-file: go.mod
          cache-id: spec

      # The toolchain that spec/tasks/lean-toolchain names, cached by that file.
      # spec/grants names the same one.
      - name: Cache the Lean toolchain
        id: elan-cache
        uses: actions/cache@v6
        with:
          path: ~/.elan
          key: elan-4.2.4-${{ runner.os }}-${{ hashFiles('spec/tasks/lean-toolchain') }}

      # elan-init.sh of elan v4.2.4, pinned by commit and checked by its
      # sha256, since a tag can move.
      - name: Install the Lean toolchain
        if: steps.elan-cache.outputs.cache-hit != 'true'
        env:
          ELAN_COMMIT: 227caca133724d5516bee25c2aeb3e609478f2d8
          ELAN_INIT_SHA256: a620ff1641616222c8d37c54845492004bb84d6877cdbc944dd65c1aa685bf53
        run: |
          set -euo pipefail
          curl -sSfL "https://raw.githubusercontent.com/leanprover/elan/$ELAN_COMMIT/elan-init.sh" -o "$RUNNER_TEMP/elan-init.sh"
          echo "$ELAN_INIT_SHA256  $RUNNER_TEMP/elan-init.sh" | sha256sum -c -
          sh "$RUNNER_TEMP/elan-init.sh" -y --no-modify-path --default-toolchain none
          cd spec/tasks && "$HOME/.elan/bin/elan" toolchain install "$(cat lean-toolchain)"

      - run: echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

      # Lake rebuilds what changed, so a restored build checks only the
      # changed proofs.
      - name: The toolchains of the models are the same
        run: cmp spec/tasks/lean-toolchain spec/grants/lean-toolchain

      - name: Cache the model builds
        uses: actions/cache@v6
        with:
          path: |
            spec/tasks/.lake
            spec/grants/.lake
          key: lake-${{ runner.os }}-${{ hashFiles('spec/*/lean-toolchain', 'spec/*/lakefile.toml', 'spec/**/*.lean') }}
          restore-keys: lake-${{ runner.os }}-

      - name: Build the task model and check the proofs
        working-directory: spec/tasks
        run: lake build

      - name: Build the grants model and check the proofs
        working-directory: spec/grants
        run: lake build

      - name: Compare the models with the Go code
        run: go test -tags spec -count=1 -run 'TestTaskMoveMatchesLeanModel|TestGrantsMatchLeanModel' -v ./internal/session/

      # scripts/ci-changes.sh starts this job for a change to a file in the
      # list, so the list must name every file the grant checks reach.
      - name: The Go files of the grants model are listed
        run: spec/grants/go-files.sh check
