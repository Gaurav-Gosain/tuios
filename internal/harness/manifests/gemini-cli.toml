schema_version = 1
id             = "gemini-cli"
display_name   = "Gemini CLI"
priority       = 50

[detect]
comm      = ["gemini"]
argv0     = ["gemini"]
argv_path = ["@google/gemini-cli"]

# After herdr's gemini manifest (github.com/herdrdev/herdr,
# src/detect/manifests/gemini.toml, manifest version 2026.06.10.1, Apache-2.0;
# see LICENSE-herdr), plus an idle rule on the input box. Gemini CLI draws its
# input in a rounded box:
#
#   ╭──────────────────────────────────────────────╮
#   │ >   Type your message or @path/to/file       │
#   ╰──────────────────────────────────────────────╯
#
# Not measured here: Gemini CLI is not installed on the machine these rules
# were written on. A rule that does not match costs nothing.
[screen]
enabled   = true
fold_case = true
lines     = 8

# A tool call waiting for approval: the dialog's heading, a proceed question
# with a yes, or the highlighted yes or allow option.
[[screen.rule]]
state    = "needs_input"
priority = 30
kind     = "approval"
message  = "Waits for approval of a tool call."
any_of   = [
  { any = ["│ apply this change", "│ allow execution"] },
  { all = ["yes"], any = ["waiting for user confirmation", "│ do you want to proceed", "do you want to proceed?"] },
  { regex = ['(?i)^\s*❯.*(yes|allow)'] },
]

# A turn in progress: the spinner line above the box carries the cancel hint.
#
#   ⠏ Thinking... (esc to cancel, 3s)
[[screen.rule]]
state    = "working"
priority = 10
message  = "Works on a turn."
all      = ["esc to cancel"]

# The input box at rest, read inside the box: its ">" prompt, or "!" in shell
# mode. An approval dialog in the box has neither at the start of a line.
[[screen.rule]]
state    = "idle"
priority = 5
message  = "Waits at its prompt."
region   = "prompt_box"
regex    = ['^\s*│\s*[>!]\s']

# The window title. Gemini CLI writes its status there with a glyph in front,
# from packages/cli/src/utils/windowTitle.ts (computeTerminalTitle), each
# followed by " (<folder>)" and padded to 80 columns:
#
#   ✋  Action Required     waiting for a confirmation
#   ⏲  Working…            a turn with nothing to show
#   ✦  <thought>           a turn, showing the model's current thought
#   ◇  Ready               idle
#
# With dynamic titles off the title is "Gemini CLI (<folder>)", which says
# nothing about state and matches no rule. The rules key on the glyph so a
# thought that begins with "Action required" or "Ready" reads as the turn it
# is, not as a block or a rest. Not measured here.
[title]
enabled = true

[[title.rule]]
state    = "needs_input"
priority = 10
kind     = "approval"
message  = "Gemini CLI says an action is required"
regex    = ['^\s*✋\x{FE0F}?\s+Action Required\b']

[[title.rule]]
state    = "working"
priority = 5
message  = "Works on a turn."
regex    = ['^\s*(?:⏲\x{FE0F}?|✦)\s']

[[title.rule]]
state    = "idle"
priority = 1
message  = "Waits at its prompt."
regex    = ['^\s*◇\s+Ready\b']

# How a prompt is typed in. Gemini CLI is an Ink program: Ink reads a carriage
# return as return and a line feed as a different key, and Gemini CLI handles
# a bracketed paste as one paste. Not measured here.
[input]
submit          = "cr"
bracketed_paste = true
source          = "Ink parse-keypress reads CR as return, LF as another key; not measured"
