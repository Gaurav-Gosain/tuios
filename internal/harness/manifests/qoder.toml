# Rules after herdr's agent-detection manifest for qoder
# (github.com/herdrdev/herdr, src/detect/manifests/qodercli.toml, herdr id
# "qodercli", manifest version 2026.06.10.1, Apache-2.0; see LICENSE-herdr).
# Regenerate a draft with
#   go run ./internal/harness/herdrconv
# Not verified against a live pane. herdr has no idle rule for it.

schema_version = 1
id             = "qoder"
display_name   = "Qoder"
priority       = 50

# npm @qoder-ai/qodercli is a pure node bundle (bins qoder and qodercli); the
# China mirror @qodercn-ai/qoderclicn ships the same CLI under its own names.
# The process is always node, so the run token is the identity.
[detect]
argv0     = ["qoder", "qodercli", "qodercn", "qoderclicn"]
argv_path = ["@qoder-ai/qodercli", "@qodercn-ai/qoderclicn"]

[screen]
enabled   = true
fold_case = true
lines     = 8

# herdr rule: confirmation_or_input_blocker. A confirmation with its answers,
# or one of the phrases that only a waiting prompt shows.
[[screen.rule]]
state    = "needs_input"
priority = 300
message  = "Waits for your answer on the screen."
any_of   = [
  { all = ["waiting for user confirmation"], any = ["yes", "no", "allow", "reject"] },
  { all = ["awaiting approval"], any = ["allow", "reject"] },
  { any = ["permission required", "allow once or always?", "asking user", "enter your response", "review your answers:", "shell awaiting input"] },
]

# herdr rule: cancel_hint_working. The cancel hint with its timer.
#
#   ⠹ Reading files (esc to cancel, 4s)
[[screen.rule]]
state    = "working"
priority = 100
message  = "Works on a turn."
all      = ["(esc to cancel,"]

# herdr rule: spinner_working. A braille spinner in front of words.
[[screen.rule]]
state    = "working"
priority = 90
message  = "Works on a turn."
regex    = ['^\s*[\x{2800}-\x{28FF}][ \t]+.*\pL']

# How a prompt is typed in. Not measured.
[input]
submit          = "cr"
bracketed_paste = true
source          = "default: Enter sends CR in raw mode; not measured"
