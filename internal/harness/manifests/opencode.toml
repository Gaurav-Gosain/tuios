schema_version = 1
id             = "opencode"
display_name   = "opencode"
priority       = 50

[detect]
comm      = ["opencode"]
argv0     = ["opencode"]
argv_path = ["opencode-ai", "/opencode/"]

# After herdr's opencode manifest, plus an idle rule on the input box. opencode
# draws its input with a heavy bar on the left and closes it with a half-block
# edge, with the key hints under it. Measured on opencode 1.18.30:
#
#   ┃  Ask anything… "Fix a TODO in the codebase"
#   ┃
#   ┃  Build · Muse Spark 1.3 Free OpenCode Zen
#   ╹▀▀▀▀▀▀▀▀▀▀▀▀▀▀▀▀▀▀▀▀▀▀▀▀▀▀▀▀▀▀▀▀▀▀▀▀▀▀▀▀▀▀▀▀▀▀▀
#                                  tab agents  ctrl+p commands
[screen]
enabled = true
lines   = 8

# A permission request.
[[screen.rule]]
state    = "needs_input"
priority = 30
kind     = "approval"
message  = "Waits for permission."
all      = ["△ Permission required"]

# A turn in progress: the footer offers to interrupt it.
[[screen.rule]]
state    = "working"
priority = 10
message  = "Works on a turn."
any      = ["esc interrupt", "esc to interrupt", "ctrl+c to interrupt"]

# A turn in progress, when the footer shows the moving block bar rather than
# the hint. After herdr's opencode manifest (manifest version 2026.06.10.1,
# Apache-2.0; see LICENSE-herdr).
#
#   ■■■■⬝⬝⬝⬝  esc interrupt
[[screen.rule]]
state    = "working"
priority = 10
message  = "Works on a turn."
region   = "bottom_non_empty_lines(4)"
regex    = ['(?:■|⬝){4,}']

# The input box at rest: its bottom edge and the key hints under it, with no
# interrupt offered.
[[screen.rule]]
state    = "idle"
priority = 5
message  = "Waits at its prompt."
regex    = ['^\s*╹▀{8,}\s*$']
any      = ["ctrl+p commands", "tab agents"]
not      = ["interrupt"]

# How a prompt is typed in. Measured on opencode 1.18.30: it turns on bracketed
# paste (DECSET 2004) at start and pushes no kitty keyboard flags, so Enter
# arrives as a carriage return.
[input]
submit          = "cr"
bracketed_paste = true
source          = "measured on opencode 1.18.30 (DECSET 2004 on, no kitty keyboard flags)"

[resume]
argv   = ["opencode", "--session", "{session_id}"]
source = "opencode --help: -s, --session continues a session by id; herdr src/agent_resume.rs"
