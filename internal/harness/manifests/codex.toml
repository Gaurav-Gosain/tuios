schema_version = 1
id             = "codex"
display_name   = "Codex"
priority       = 50
# Codex runs the hooks of every conversation from one app-server process. A
# Codex in another terminal can attach to the server a pane's codex started,
# so its hooks carry the pane's TUIOS_PANE_ID and the same harness pid. With
# this set, another conversation takes the pane over only on its SessionStart.
shared_server  = true

[detect]
comm      = ["codex"]
argv0     = ["codex"]
argv_path = ["@openai/codex"]
exe_glob  = ["**/vendor/*/bin/codex", "**/codex"]

# The screen carries working and idle, and the blocking prompts below, after
# herdr's codex manifest (github.com/herdrdev/herdr,
# src/detect/manifests/codex.toml, manifest version 2026.10.11.1, herdr commit
# 6d697e1, Apache-2.0; see LICENSE-herdr). The title and notifications below still carry most of
# Codex's blocked state; these rules catch the prompts that paint and go quiet.
#
# Not ported: herdr's osc_title_idle, which reads any title that is not a
# spinner as idle. A title proves only that something set one, as the title
# block below says, so the idle rule stays on the composer. herdr's
# weak_blocker and its screen working fallback, which read
# regions cut at Codex's own prompt marker (after_last_prompt_marker and
# friends); the rules here read the bottom lines instead. herdr's
# transcript_viewer rule, which holds the state while the transcript pager is
# open, has no equivalent: tuios has no "leave the state alone" rule.
[screen]
enabled   = true
fold_case = true
lines     = 8

# A live approval or question form. Its footer is the bottom line.
#
#   Would you like to run the following command?
#   $ go test ./...
#   › 1. Yes, proceed (y)
#     2. No, and tell Codex what to do differently (esc)
#   Press enter to confirm or esc to cancel
[[screen.rule]]
state    = "needs_input"
priority = 30
kind     = "approval"
message  = "Waits for approval."
region   = "bottom_non_empty_lines(3)"
any      = ["press enter to confirm or esc to cancel", "enter to submit answer", "enter to submit all", "allow command?"]

# Codex prints each option's own shortcut after its label, "(y)", "(a)" and
# "(esc)", and those are the keys pressed here. Each is bound to the label it
# belongs to, so a question form that shares this footer offers deny and
# nothing else.
[screen.rule.answers]
approve        = { option = "yes", keys = ["y"] }
approve_always = { option = "yes, and don't ask again", keys = ["a"] }
deny           = { keys = ["esc"] }

# Trusting a directory, asked once when Codex starts somewhere new.
#
#   > You are in /home/u/src/app
#     Do you trust the contents of this directory? Working with untrusted
#     contents comes with higher risk of prompt injection.
#   › 1. Yes, continue
#     2. No, quit
#     Press enter to continue
#
# Newer Codex releases use a shorter question and different choices:
#
#     Trust this folder? Codex can read, edit, and run files here, subject to
#     your permission settings.
#   › 1. Trust and continue
#     2. Back to Agent Command Center
#     enter continue · esc back
[[screen.rule]]
state    = "needs_input"
priority = 30
kind     = "approval"
message  = "Asks you to trust the directory."
regex    = ['(?i)(?:do\s+you\s+trust\s+the\s+contents\s+of\s+this\s+directory\?|trust\s+this\s+folder\?)']
any      = ["press enter to continue", "enter continue · esc back", "1. yes", "1. trust and continue"]

# The update offer at start, which waits for a key before Codex runs.
#
#   Update available! 0.150.0 -> 0.151.0
#   1. Update now
#   2. Skip until next version
#   Press enter to continue
[[screen.rule]]
state    = "needs_input"
priority = 30
kind     = "question"
message  = "Offers an update and waits."
all      = ["update available!", "update now"]
regex    = ['Skip\s+until\s+next\s+version', 'Press enter to continue\s*\z']

# The update chooser of Codex 0.159 and later, which has a different heading
# and footer. The passive update notice in the history has neither footer.
#
#   Update available · 0.159.0 -> 0.160.0
#   › 1. Update now
#     2. Skip
#   enter continue · esc skip
[[screen.rule]]
state    = "needs_input"
priority = 30
kind     = "question"
message  = "Offers an update and waits."
regex    = ['(?i)^\s*update\s+available\s+·', '(?i)enter\s+continue\s+·\s+esc\s+skip\s*\z']

# The file mention popup, which takes keys until a choice or esc. herdr reads
# it below the prompt marker; here the three tab names are enough.
#
#   All Results   Filesystem Only   Plugins
[[screen.rule]]
state    = "needs_input"
priority = 30
kind     = "question"
message  = "Waits for a mention choice."
region   = "bottom_non_empty_lines(8)"
all      = ["all results", "filesystem only", "plugins"]

# A turn in progress: the status line above the composer carries an elapsed
# timer and the interrupt hint.
#
#   • Working (12s • esc to interrupt)
[[screen.rule]]
state    = "working"
priority = 10
message  = "Works on a turn."
regex    = ['\((?:[0-9]+[hm] )*[0-9]+s • [^)\n]*to interrupt\)']

# The composer at rest: its "›" marker at column zero and the footer under it.
# An approval menu numbers its choices behind the same marker, and a turn in
# progress shows the interrupt hint, so either refuses the rule.
#
#   › Explain this codebase
#
#     ? for shortcuts                                100% context left
[[screen.rule]]
state     = "idle"
priority  = 5
message   = "Waits at its prompt."
regex     = ['^›(?:\s|$)']
any       = ["? for shortcuts", "context left"]
not       = ["to interrupt"]
not_regex = ['^›\s*[0-9]+\.']

# Codex writes "Action Required" into the window title when it is waiting on a
# person, and a braille spinner while a turn runs.
#
# A title proves that something set a title, so a rule is only worth shipping
# when the phrase is unambiguous and the agent writes it deliberately. There is
# no idle rule here: an idle Codex title is just a name, and a title left behind
# by the shell would read the same.
[title]
enabled   = true
fold_case = true

[[title.rule]]
state    = "needs_input"
priority = 10
kind     = "approval"
message  = "Codex says an action is required"
any      = ["action required"]

[[title.rule]]
state    = "working"
priority = 5
message  = "Works on a turn."
regex    = ['(?:^| )[⠋⠙⠹⠸⠼⠴⠦⠧⠇⠏](?: |$)']

# Desktop notifications over OSC 9. Codex sends one when it wants an approval
# and one when a turn ends, whose text is the start of its answer, so anything
# that is not an approval request is the turn finishing.
[notify]
enabled   = true
fold_case = true

[[notify.rule]]
state    = "needs_input"
priority = 10
kind     = "approval"
message  = "Asks for approval."
any      = ["approval requested", "wants to edit"]

[[notify.rule]]
state    = "done"
priority = 0
message  = "Finished its turn."
regex    = ['\S']

# How a prompt is typed in. Codex's TUI reads keys through crossterm, which in
# raw mode reads a carriage return as Enter and a line feed as Ctrl+J, and Codex
# turns bracketed paste on. It also detects an unbracketed paste by timing and
# turns an Enter inside the burst into a newline, which is why the submitter
# waits between the paste and the Enter. Not measured here: Codex is not
# installed on the machine these values were written on.
# Codex writes each session to a rollout, one JSON record per line, at
# ~/.codex/sessions/YYYY/MM/DD/rollout-<time>-<thread id>.jsonl (codex-rs/
# rollout in openai/codex). The hook (tuios integration install codex) reports
# its path. Without the hook the daemon takes the rollout whose session_meta
# names the pane's directory and the start of the pane's Codex. The
# file is read only to show the conversation in the agent thread. It gives no
# state: the hooks and the screen rules do that.
[transcript]
reader = "codex-rollout"
dir    = "{home}/.codex/sessions"
glob   = "*/*/*/rollout-*.jsonl"
verify = ["cwd"]

# The composer with nothing typed in it: the prompt glyph alone, or with its
# placeholder, and at most the one footer line under it. The glyph is "›",
# and "»" at Ultra effort. A composer in shell mode shows "!", which Codex
# itself counts as typed input, so it is a draft here too. The placeholder is
# drawn dim (Span::dim, SGR 2), and the daemon leaves faint cells out before
# this reads the screen. The two placeholders are listed too, for a screen
# read as text alone. Any footer counts: it reads "? for shortcuts", the
# mode, the model or the context left, by what is set.
#
# Source, at rust-v0.165.0 (openai/codex 360319d8dee6):
#   codex-rs/tui/src/chatwidget.rs:2101-2102   PLACEHOLDER, SIDE_PLACEHOLDER
#   codex-rs/tui/src/bottom_pane/chat_composer.rs:4890-4893, 4952
#       the glyph ("›" bold, dim while input is off) and the dim placeholder
#   codex-rs/tui/src/bottom_pane/effort_ignition.rs:105-109   "»" at Ultra
#   codex-rs/tui/src/bottom_pane/chat_composer.rs:1162   shell mode is not empty
[prompt_box]
region = "tail"
empty  = ['(?:\A|\n)[›»][ \x{00A0}]*(?:Ask Codex to do anything|Ask a follow-up question)?[ \x{00A0}]*(?:\n[^\n]*)?\z']
source = "read from openai/codex rust-v0.165.0 (360319d8dee6) and its composer snapshots; not measured on a live screen"

[input]
submit          = "cr"
bracketed_paste = true
source          = "crossterm reads CR as Enter and LF as Ctrl+J in raw mode; paste-burst handling per herdr src/app/api/agents.rs; not measured"
images          = "path_paste"
images_source   = "a paste that is one image path attaches it (chat_composer.rs); not measured"

[resume]
argv   = ["codex", "resume", "{session_id}"]
source = "codex resume <SESSION_ID>; herdr src/agent_resume.rs"
# codex resume takes the same options as codex itself: ResumeCommand flattens
# TuiCli in codex-rs/cli/src/main.rs. The names are from SharedCliOptions in
# codex-rs/utils/cli/src/shared_options.rs and TuiCli in
# codex-rs/tui/src/cli.rs. In Codex -p is --profile, not a one-shot print.
keep_options = ["--model", "-m", "--profile", "-p", "--sandbox", "-s", "--ask-for-approval", "-a", "--local-provider"]
keep_flags   = ["--dangerously-bypass-approvals-and-sandbox", "--yolo", "--approve-for-me", "--oss", "--search"]
keep_source  = "openai/codex at b5c5d46: shared_options.rs, tui/src/cli.rs, cli/src/main.rs"
# The kept flags that turn approvals or the sandbox off: the bypass flag and
# its alias, and the values SandboxModeCliArg::DangerFullAccess and
# ApprovalModeCliArg::Never (codex-rs/utils/cli/src, kebab-case).
keep_risky   = ["--dangerously-bypass-approvals-and-sandbox", "--yolo", "--sandbox=danger-full-access", "-s=danger-full-access", "--ask-for-approval=never", "-a=never"]
