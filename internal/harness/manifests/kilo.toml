# Rules after herdr's agent-detection manifest for kilo
# (github.com/herdrdev/herdr, src/detect/manifests/kilo.toml, manifest version
# 2026.06.10.1, Apache-2.0; see LICENSE-herdr). Regenerate a draft with
#   go run ./internal/harness/herdrconv
# Kilo's TUI shares opencode's chrome. herdr has no idle rule for it, and
# opencode's idle rule is not borrowed: it was measured on opencode, not on
# Kilo.

schema_version = 1
id             = "kilo"
display_name   = "Kilo Code"
priority       = 50

# npm @kilocode/cli is a node shim (bins kilo and kilocode) that spawns a
# platform binary named kilo out of node_modules, so both shapes run: a node
# process whose run token is the shim, and a native child.
[detect]
comm      = ["kilo"]
argv0     = ["kilo", "kilocode"]
argv_path = ["@kilocode/cli"]

# "kilo" is four letters and famously also a text editor, so the bare name only
# counts backed by a JS runtime (the shim) or Kilo's node_modules layout (the
# spawned binary).
[detect.require]
exe_base = ["node", "nodejs", "bun", "deno"]
exe_glob = ["**/@kilocode/**"]

[screen]
enabled   = true
fold_case = true
lines     = 8

# herdr rule: opencode_permission. The explicit banner, or a dialog's dismiss
# and confirm hints together with a selection hint.
[[screen.rule]]
state    = "needs_input"
priority = 300
kind     = "approval"
message  = "Waits for permission."
any_of   = [
  { all = ["△ permission required"] },
  { all = ["esc dismiss"], any = ["enter confirm", "enter submit", "enter toggle"], all_of = [ { any = ["↑↓ select", "⇆ tab"] } ] },
]

# herdr rule: esc_interrupt_working. The interrupt hint in the footer.
[[screen.rule]]
state    = "working"
priority = 100
message  = "Works on a turn."
all      = ["esc interrupt"]

# How a prompt is typed in. Not measured; opencode, whose TUI Kilo shares,
# turns on bracketed paste and submits on a carriage return.
[input]
submit          = "cr"
bracketed_paste = true
source          = "default: Enter sends CR in raw mode; shares opencode's TUI; not measured"
