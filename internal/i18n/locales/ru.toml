# ru.toml — русский словарь строк интерфейса страницы настроек, перевод
# английского шаблона en.toml.
#
# Каждый файл локали несёт те же секции и ключи, что и шаблон. Ключа, которого
# в локали нет, отвечает тот же ключ шаблона, поэтому недописанный перевод
# показывает английскую строку, а не пустоту.

[meta]
code = "ru"
name = "Русский"

# Категории страницы настроек, по одной на вкладку. Ключ категории — её
# английское имя, которое вкладка и рисует; другая локаль переводит значение.
[settings.category]
"Appearance" = "Оформление"
"Backgrounds" = "Фон"
"Sidebar" = "Боковая панель"
"Selection" = "Выделение"
"Dock" = "Док"
