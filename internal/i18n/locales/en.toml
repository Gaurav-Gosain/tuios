# The description shown under a config path: the registry's own, verbatim.
[settings.desc]
"agents.acp_version" = "The ACP version a pane start-agent --protocol acp opens asks the agent for: 1, or 2, a draft of the spec. An agent that speaks only version 1 still works when 2 is asked for. The daemon reads it when it starts a protocol pane"
"agents.answer_advance" = "After an answer in the agents view, move the cursor to the next agent that needs you. Off keeps the cursor on the agent you answered."
"agents.ask_wait_seconds" = "Seconds ask-human waits for your answer when the agent names no timeout. The question stays after the wait. 0 uses 120"
"agents.card_preview" = "Where the task board shows the focused card's preview: beside the columns, over them, beside them on a wide screen and over them otherwise, or never. Space on a card opens and closes it."
"agents.card_preview_width" = "The width of the task board's preview panel: a number of cells, such as 70, or a share of the view, such as 40%. Empty is 40%, at least 44 and at most 96 cells. A drag on the edge of the panel changes it, and the view keeps that choice."
"agents.enabled" = "Agents, the Inbox, mail and approvals. Turn off to keep only the multiplexer."
"agents.fold_working" = "Fold the Working group of the agents view. F folds or opens a group, and the view keeps that choice."
"agents.list_width" = "The width of the agents view's list: a number of cells, such as 52, or a share of the view, such as 30%. Empty follows the screen. The < and > keys and a drag on the edge of the list change it, and the view keeps that choice."
"agents.name_hint" = "Whether the start hint tells an agent to name its pane after its task. Off leaves that line out and tells the agent not to rename its pane or its session, so the title the program sets and the session's label stay as they are. A running agent keeps the hint it got at its start."
"agents.reply_markers" = "Ask the agents that start-agent starts to write reply markers, such as [[Done]] and [[Failed: 3 tests]]. The agents view shows each marker as a coloured label. It applies to Claude Code, which takes an added system prompt."
"agents.reply_rows" = "The most rows a multi-line editor grows to before it scrolls: a reply to an agent or to many, a mail draft and a new agent's task. 0 keeps each editor's own: 8 for a reply, 6 for mail, 3 for a task. An editor never takes more rows than its view has, and alt+m in it takes all of them."
"agents.undo_window_seconds" = "Seconds after a dismiss, a snooze or a queued reply that u takes it back. 0 uses 10"
"agents.view_list" = "How the agents view shows its list on a wide screen: a column beside the focus, a strip of chips above it, or a strip for two agents or fewer. The \\ key switches it, and the view keeps that choice."
"appearance.alt_drag" = "Alt plus left-drag moves a pane"
"appearance.animation_speed" = "Percent window animations run at: 100 as shipped, 200 twice as fast, 50 half as fast"
"appearance.animations_enabled" = "Animate UI transitions instead of applying them instantly"
"appearance.auto_enter_terminal_on_focus" = "Type in a pane when a keyboard focus command moves to it: off, targeted (select and arrows), or all (including Tab)"
"appearance.background" = "Background painted on every surface not set on its own (panes, desktop, window chrome, dock, rail): off (your terminal shows through), theme, or a colour (#rrggbb, 0-255, a slot name or a role name)"
"appearance.border_focused_color" = "Colour overriding the focused pane's border in both modes: #89b4fa, a slot name such as bright_cyan, or a role such as accent"
"appearance.border_focused_color_terminal" = "Colour of the focused pane's border in terminal mode. It wins over border_focused_color"
"appearance.border_focused_color_window" = "Colour of the focused pane's border in window mode. It wins over border_focused_color"
"appearance.border_focused_gradient" = "Two or more colours, separated by spaces or commas, that the focused pane's border steps through. Empty draws one colour"
"appearance.border_gradient_angle" = "Direction of the focused border's gradient in degrees: 0 runs left to right, 90 top to bottom, 45 from the top left corner to the bottom right one"
"appearance.border_style" = "Border style drawn around every pane"
"appearance.border_unfocused_color" = "Colour overriding an unfocused pane's border: #585b70, a slot name such as bright_black, or a role such as muted"
"appearance.calm" = "Calm mode: nothing moves or blinks, and only messages that need you show in the dock"
"appearance.cell_frames" = "Which clients write their frames as diffed cells instead of through Bubble Tea's renderer, which turns each frame into text and back. served: clients over SSH and the web. all: this terminal as well. off: none. TUIOS_CELL_FRAME=1 means all and 0 means off"
"appearance.chord_timeout_ms" = "Milliseconds the first key of a two-key chord (gg in copy mode and the scrollback browser) waits for the second"
"appearance.click_to_type" = "What a click on a pane's content does in window-management mode"
"appearance.clock_format" = "Go time layout the clock is drawn with, e.g. 15:04 or Mon 3:04PM"
"appearance.confirm_close" = "When closing a pane by hand (a key, its menu or its close control) asks first: never, busy (the pane runs something besides its shell) or always"
"appearance.confirm_quit" = "Always confirm on quit, not only when processes are running"
"appearance.copy_on_select" = "Copy a mouse selection to the clipboard on release"
"appearance.copy_search_max_matches" = "Matches one copy mode search keeps. The renderer walks every match on every frame, so a very high value slows a one-letter query over a long scrollback. A search that stops at the limit shows 1000+."
"appearance.desktop_background" = "Background behind and between panes: the gaps between tiled panes, the space around floating ones, and an empty workspace with its welcome splash. off, theme, or a colour (#rrggbb, 0-255, a slot name or a role name); empty follows appearance.background"
"appearance.dim_foreground" = "Let dim_unfocused dim a pane's text too, not only its background"
"appearance.dim_multifocus" = "Dim the panes in the multifocus set like other panes you are not in"
"appearance.dim_unfocused" = "How much tuios fades a pane you are not in, as a percent. 0 is off."
