# en.toml is the English dictionary of the settings page's interface
# strings, and the template every other locale is translated from.
#
# Every locale file carries the same sections and keys as this one. A key a
# locale does not carry falls back to the same key here, so a locale that is
# still being translated shows the English line rather than a blank.

[meta]
code = "en"
name = "English"

# The categories of the settings page, one per tab. A category's key is
# its English name, the name the tab draws; another locale translates
# the value.
[settings.category]
